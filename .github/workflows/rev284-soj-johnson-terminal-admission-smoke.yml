name: rev284 corrected SOJ Johnson terminal admission smoke

on:
  pull_request:
    paths:
      - automation_runs/2026-08-22_1043_JST/corrected_soj_johnson_terminal_admission_v1.py
      - automation_runs/2026-08-22_1043_JST/test_corrected_soj_johnson_terminal_admission_rev284.py
      - automation_runs/2026-08-22_1043_JST/REV284_SOJ_JOHNSON_TERMINAL_ADMISSION.md
      - .github/workflows/rev284-soj-johnson-terminal-admission-smoke.yml
      - agi/run-history/phase-admissions/chatgpt-session-j-rev284-soj-johnson-terminal-admission-20260822T104315JST-9f17a7e6-attempt-solution.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited Johnson test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run inherited main primitive-Johnson regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: python -m unittest -v test_primitive_johnson_ground_terminal_rev173.py
      - name: Run focused rev284 regressions
        working-directory: automation_runs/2026-08-22_1043_JST
        run: python -m unittest -v test_corrected_soj_johnson_terminal_admission_rev284.py
      - name: Compile rev284 implementation and tests
        run: >-
          python -m py_compile
          automation_runs/2026-08-22_1043_JST/corrected_soj_johnson_terminal_admission_v1.py
          automation_runs/2026-08-22_1043_JST/test_corrected_soj_johnson_terminal_admission_rev284.py
      - name: Enforce active-sibling import boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("automation_runs/2026-08-22_1043_JST/corrected_soj_johnson_terminal_admission_v1.py").read_text()
          forbidden = (
              "bipartite_split_or_johnson_transition_v1",
              "corrected_soj_recurrence_composition_v1",
              "primitive_johnson_proof_dag_consumer_v1",
          )
          hits = [name for name in forbidden if name in text]
          if hits:
              raise SystemExit(f"active sibling branch-only dependency detected: {hits}")
          print("rev284 dependency boundary: success")
          PY
