name: rev197 UPCC subconstituent smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/upcc_subconstituent_split_family_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_upcc_subconstituent_split_family_rev197.py'
      - '.github/workflows/rev197-upcc-subconstituent-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev197:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate complete UPCC one-point subconstituent split family
        run: python -m pytest -q test_upcc_subconstituent_split_family_rev197.py
