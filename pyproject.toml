[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j-agent"
version = "0.3.0"
description = "Bounded, testable general problem-solving research agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40.0,<4"]

[project.scripts]
j-agent = "j_agent:main"

[tool.setuptools]
py-modules = ["j_agent", "benchmarks"]
