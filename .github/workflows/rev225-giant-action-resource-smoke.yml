name: rev225 giant-action resource smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/giant_action_resource_envelope_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/giant_block_action_certificates.py'
      - 'automation_runs/2026-08-19_0851_JST/local_certificate_beard_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/unaffected_stabilizer_reduction_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/theorem_local_certificate_relation_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_giant_action_resource_envelope_rev225.py'
      - '.github/workflows/rev225-giant-action-resource-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev225-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_giant_action_resource_envelope_rev225.py
          test_local_certificate_preimage_resource_rev224.py
          test_prepared_block_action_local_certificate_rev223.py
          test_theorem_local_certificate_relation_rev222.py
          test_local_certificate_beard_v1.py
          test_unaffected_stabilizer_reduction_v1.py
          test_giant_block_action_certificates.py
