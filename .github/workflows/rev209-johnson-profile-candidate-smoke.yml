name: rev209 Johnson profile candidate smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/u2_candidate_coset_string_iso_v2.py'
      - 'automation_runs/2026-08-19_0851_JST/s1_string_isomorphism_v2.py'
      - 'automation_runs/2026-08-19_0851_JST/test_candidate_johnson_profile_integration_rev209.py'
      - '.github/workflows/rev209-johnson-profile-candidate-smoke.yml'

permissions:
  contents: read

jobs:
  rev209-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: python -m pytest -q test_candidate_johnson_profile_integration_rev209.py
