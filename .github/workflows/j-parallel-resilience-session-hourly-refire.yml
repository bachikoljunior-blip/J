name: J parallel resilience session hourly re-fire

on:
  schedule:
    - cron: "56 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "automation/session_refire.py"
      - "automation/test_session_refire.py"
      - ".github/workflows/j-parallel-resilience-session-hourly-refire.yml"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: j-parallel-resilience-session-hourly-refire-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  re-fire-stale-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect stale session activity without touching siblings
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: chatgpt-session-j-parallel-resilience-20260821T215558JST-01ad84ba
          CLAIM_PATH: agi/run-history/active/chatgpt-session-j-parallel-resilience-20260821T215558JST-01ad84ba.json
          BRANCH: ops-j-parallel-resilience-20260821-215558
        run: |
          set -euo pipefail

          claim_file="$(mktemp)"
          trap 'rm -f "${claim_file}"' EXIT
          if ! gh api "repos/${REPOSITORY}/contents/${CLAIM_PATH}?ref=main" \
              --jq '.content' | tr -d '\n' | base64 --decode >"${claim_file}"; then
            echo "stale=false" >>"${GITHUB_OUTPUT}"
            echo "reason=claim_absent" >>"${GITHUB_OUTPUT}"
            {
              echo "### J parallel resilience session guard"
              echo "- Decision: claim is absent; no session re-fire is emitted"
              echo "- Other branches, PRs, claims, and workflows inspected or changed: none"
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          branch_updated=""
          if branch_updated="$(
            gh api "repos/${REPOSITORY}/commits/${BRANCH}" \
              --jq '.commit.committer.date // .commit.author.date' 2>/dev/null
          )"; then
            :
          else
            branch_updated=""
          fi

          owner="${REPOSITORY%%/*}"
          pr_updated="$(
            gh api "repos/${REPOSITORY}/pulls?state=open&head=${owner}:${BRANCH}&per_page=1" \
              --jq '.[0].updated_at // empty'
          )"

          args=(
            check
            --claim-file "${claim_file}"
            --claim-id "${CLAIM_ID}"
            --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          )
          [[ -n "${branch_updated}" ]] && args+=(--branch-activity-at "${branch_updated}")
          [[ -n "${pr_updated}" ]] && args+=(--pr-activity-at "${pr_updated}")

          decision="$(python automation/session_refire.py "${args[@]}")"
          stale="$(jq -r '.should_refire' <<<"${decision}")"
          reason="$(jq -r '.reason' <<<"${decision}")"
          echo "stale=${stale}" >>"${GITHUB_OUTPUT}"
          echo "reason=${reason}" >>"${GITHUB_OUTPUT}"

          {
            echo "### J parallel resilience session guard"
            echo "- Claim status: $(jq -r '.claim_status' <<<"${decision}")"
            echo "- Latest dedicated activity: $(jq -r '.latest_activity_at_jst' <<<"${decision}")"
            echo "- Re-fire after: $(jq -r '.refire_after_jst' <<<"${decision}")"
            echo "- Dedicated branch activity: ${branch_updated:-missing}"
            echo "- Dedicated PR activity: ${pr_updated:-missing}"
            echo "- Other branches, PRs, claims, and workflows inspected or changed: none"
            echo "- Decision: ${reason}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Emit deduplicated durable continuation request
        if: github.event_name != 'pull_request' && steps.guard.outputs.stale == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAIM_PATH: agi/run-history/active/chatgpt-session-j-parallel-resilience-20260821T215558JST-01ad84ba.json
          BRANCH: ops-j-parallel-resilience-20260821-215558
        run: |
          set -euo pipefail

          title="[automation] J parallel resilience session re-fire queue"
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          issue_number="$(
            gh issue list --repo "${REPOSITORY}" --state open --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n 1
          )"

          message="Hourly session continuation re-fire requested at ${timestamp}. Reconstruct only this session from ${CLAIM_PATH} and branch ${BRANCH}; preserve every sibling claim, branch, PR, and workflow. Follow automation/CHATGPT_SCHEDULED_TASK_RUNBOOK.md. Trigger: ${RUN_URL}"

          if [[ -z "${issue_number}" ]]; then
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${message}"
          else
            gh issue comment "${issue_number}" --repo "${REPOSITORY}" --body "${message}"
          fi
