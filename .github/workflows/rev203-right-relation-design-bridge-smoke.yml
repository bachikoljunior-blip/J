name: rev203 right-relation Design bridge smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/paired_bipartite_right_relation_design_bridge_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_paired_bipartite_right_relation_design_bridge_rev203.py'
      - 'automation_runs/2026-08-19_0851_JST/RIGHT_RELATION_DESIGN_BRIDGE_AUDIT_REV203.md'
      - 'automation_runs/2026-08-19_0851_JST/CURRENT_STATUS_REV0203.json'
      - '.github/workflows/rev203-right-relation-design-bridge-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev203:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate paired right-relation Design bridge
        run: python -m pytest -q test_paired_bipartite_right_relation_design_bridge_rev203.py
