name: rev204 uniform-neighborhood smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/uniform_neighborhood_hypergraph_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_uniform_neighborhood_hypergraph_rev204.py'
      - '.github/workflows/rev204-uniform-neighborhood-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev204:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate uniform-neighborhood Johnson and derived-relation gates
        run: python -m pytest -q test_uniform_neighborhood_hypergraph_rev204.py
