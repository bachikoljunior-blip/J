name: rev287 SOJ Johnson relational reduction smoke

on:
  pull_request:
    paths:
      - '.github/workflows/rev287-soj-johnson-relational-reduction-smoke.yml'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev287-soj-johnson-relational-reduction-20260822T115551JST-543db3a5-attempt-solution.json'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev287-soj-johnson-relational-reduction-20260822T115551JST-543db3a5-merge.json'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev287-soj-johnson-relational-reduction-20260822T115551JST-543db3a5-publish.json'
      - 'automation_runs/2026-08-22_1155_JST/REV287_SOJ_JOHNSON_RELATIONAL_REDUCTION.md'
      - 'automation_runs/2026-08-22_1155_JST/corrected_soj_johnson_relational_reduction_v1.py'
      - 'automation_runs/2026-08-22_1155_JST/test_corrected_soj_johnson_relational_reduction_rev287.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile rev287
        run: |
          python -m py_compile \
            automation_runs/2026-08-22_1155_JST/corrected_soj_johnson_relational_reduction_v1.py \
            automation_runs/2026-08-22_1155_JST/test_corrected_soj_johnson_relational_reduction_rev287.py
      - name: Run focused regressions
        run: python automation_runs/2026-08-22_1155_JST/test_corrected_soj_johnson_relational_reduction_rev287.py
      - name: Enforce reserved diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          changed="$(git diff --name-only origin/main...HEAD)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/rev287-soj-johnson-relational-reduction-smoke.yml|agi/run-history/phase-admissions/chatgpt-session-j-rev287-soj-johnson-relational-reduction-20260822T115551JST-543db3a5-attempt-solution.json|agi/run-history/phase-admissions/chatgpt-session-j-rev287-soj-johnson-relational-reduction-20260822T115551JST-543db3a5-merge.json|agi/run-history/phase-admissions/chatgpt-session-j-rev287-soj-johnson-relational-reduction-20260822T115551JST-543db3a5-publish.json|automation_runs/2026-08-22_1155_JST/REV287_SOJ_JOHNSON_RELATIONAL_REDUCTION.md|automation_runs/2026-08-22_1155_JST/corrected_soj_johnson_relational_reduction_v1.py|automation_runs/2026-08-22_1155_JST/test_corrected_soj_johnson_relational_reduction_rev287.py)
                ;;
              *)
                echo "unexpected non-rev287 path: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
