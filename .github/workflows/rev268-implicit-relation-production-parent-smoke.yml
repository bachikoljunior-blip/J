        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("automation_runs/2026-08-19_0851_JST/implicit_relation_production_parent_v1.py").read_text()
          forbidden = (
              "import implicit_relation_image_value_coset_v2",
