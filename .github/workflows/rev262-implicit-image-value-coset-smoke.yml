name: rev262 implicit image value-coset smoke

on:
  pull_request:
    paths:
      - automation_runs/2026-08-19_0851_JST/implicit_relation_image_value_coset_v2.py
      - automation_runs/2026-08-19_0851_JST/test_implicit_relation_image_value_coset_rev262.py
      - automation_runs/2026-08-19_0851_JST/REV262_IMPLICIT_IMAGE_VALUE_COSET.md
      - .github/workflows/rev262-implicit-image-value-coset-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rev262 focused and inherited tests
        working-directory: automation_runs/2026-08-19_0851_JST
        run: python -m unittest -v test_implicit_relation_image_action_rev257.py test_implicit_relation_image_value_coset_rev262.py
      - name: Compile rev262 implementation
        run: python -m py_compile automation_runs/2026-08-19_0851_JST/implicit_relation_image_value_coset_v2.py automation_runs/2026-08-19_0851_JST/test_implicit_relation_image_value_coset_rev262.py
