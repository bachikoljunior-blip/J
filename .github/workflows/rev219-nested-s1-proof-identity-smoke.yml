name: rev219 nested S1 proof identity smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/proof_carrying_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/s1_proof_identity_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/s1_string_isomorphism_v4.py'
      - 'automation_runs/2026-08-19_0851_JST/test_nested_s1_proof_identity_rev219.py'
      - '.github/workflows/rev219-nested-s1-proof-identity-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev219-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_nested_s1_proof_identity_rev219.py
          test_bounded_ground_s1_profile_filter_rev213.py
          test_s1_string_isomorphism_v1.py
          test_candidate_transitive_imprimitive_rev172.py
          test_execution_linked_polynomial_lift_proof_rev218.py

