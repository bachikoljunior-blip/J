name: rev203 relation-twin restriction smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/relation_twin_restriction_provenance_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_relation_twin_restriction_provenance_rev203.py'
      - 'automation_runs/2026-08-19_0851_JST/RELATION_TWIN_RESTRICTION_AUDIT_REV203.md'
      - 'automation_runs/2026-08-19_0851_JST/CURRENT_STATUS_REV0203.json'
      - '.github/workflows/rev203-relation-twin-restriction-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev203:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate exact relation-twin restriction
        run: python -m pytest -q test_relation_twin_restriction_provenance_rev203.py
