name: rev193 exact k-WL Design smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/colored_subset_exact_twl_design_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_colored_subset_exact_twl_design_rev193.py'
      - '.github/workflows/rev193-exact-twl-design-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev193:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate theorem-faithful exact k-WL Split-or-UPCC path
        run: python -m pytest -q test_colored_subset_exact_twl_design_rev193.py
