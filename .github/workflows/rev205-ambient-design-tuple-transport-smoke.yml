name: rev205 ambient Design tuple transport smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/ambient_design_tuple_transport_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_ambient_design_tuple_transport_rev205.py'
      - 'automation_runs/2026-08-19_0851_JST/relation_twin_design_wiring_v1.py'
      - '.github/workflows/rev205-ambient-design-tuple-transport-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev205-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_relation_twin_design_wiring_rev204.py
          test_ambient_design_tuple_transport_rev205.py
