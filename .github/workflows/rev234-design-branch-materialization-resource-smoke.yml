name: rev234 Design branch materialization resource smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/design_branch_materialization_resource_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/colored_subset_design_branch_plan_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/colored_subset_exact_twl_branch_plan_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/design_lemma_exact_twl_candidate_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_design_branch_materialization_resource_rev234.py'
      - '.github/workflows/rev234-design-branch-materialization-resource-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev234-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_design_branch_materialization_resource_rev234.py
          test_design_tuple_transport_resource_rev233.py
          test_correlated_twl_resource_rev232.py
          test_design_lemma_exact_twl_candidate_rev194.py
