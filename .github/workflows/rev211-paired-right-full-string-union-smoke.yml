name: rev211 paired right full string union smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/paired_uniform_neighborhood_full_string_union_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_paired_uniform_neighborhood_full_string_union_rev211.py'
      - '.github/workflows/rev211-paired-right-full-string-union-smoke.yml'

permissions:
  contents: read

jobs:
  rev211-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: python -m pytest -q test_paired_uniform_neighborhood_full_string_union_rev211.py
