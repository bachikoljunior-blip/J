name: J Continuous AGI Research Loop

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      goal:
        description: Goal for this bounded J iteration
        required: true
        default: Continue improving toward externally validated AGI criteria
      provider:
        description: Planner provider
        required: true
        type: choice
        options:
          - auto
          - offline
          - openai
        default: auto

permissions:
  contents: read

concurrency:
  group: j-continuous-agi
  cancel-in-progress: false

jobs:
  verify-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore cross-run memory
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            reports
            workspace
          key: j-continuity-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            j-continuity-${{ runner.os }}-

      - name: Install J
        run: pip install -e ".[openai]"

      - name: Environment doctor
        run: python -m j_agent --doctor

      - name: Acceptance tests
        run: python -m unittest discover -v

      - name: Critical proxy benchmarks
        run: python -m j_agent --benchmark

      - name: Run bounded autonomous iteration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          J_PROVIDER: ${{ github.event.inputs.provider || 'auto' }}
          J_GOAL: ${{ github.event.inputs.goal || 'Continue improving toward externally validated AGI criteria. Use prior memory and evidence; identify the highest-impact unresolved limitation; test a materially different approach whenever blocked; preserve reproducible evidence inside J only; never claim AGI from internal benchmarks alone.' }}
        run: python -m j_agent --goal "$J_GOAL" --provider "$J_PROVIDER" --max-steps 16

      - name: Record continuity metadata
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p state reports workspace
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          event = {
              "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "run_id": os.environ["RUN_ID"],
              "run_number": os.environ["RUN_NUMBER"],
              "event": os.environ["EVENT_NAME"],
              "head_sha": os.environ["HEAD_SHA"],
              "job_status": os.environ["RUN_STATUS"],
              "continuation_policy": "repeat hourly until externally validated AGI criteria are met",
          }
          with Path("reports/continuity.jsonl").open("a", encoding="utf-8") as handle:
              handle.write(json.dumps(event, ensure_ascii=False) + "\n")
          print(json.dumps(event, ensure_ascii=False, indent=2))
          PY

      - name: Save cross-run memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            reports
            workspace
          key: j-continuity-${{ runner.os }}-${{ github.run_id }}

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j-evidence-${{ github.run_number }}
          path: |
            state/
            reports/
            workspace/
          if-no-files-found: warn
          retention-days: 30
