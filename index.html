<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<meta name="description" content="黒鉄の刻印 — スマートフォンのブラウザで動く、フル3Dのオープンワールド・アクションRPG。">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="黒鉄の刻印 — KUROGANE">
<meta property="og:description" content="スマートフォンだけで遊べる、フル3Dオープンワールド・アクションRPG。">
<meta property="og:type" content="website">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>黒鉄の刻印 — KUROGANE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="gl" role="img" aria-label="黒鉄の刻印の3Dゲーム画面"></canvas>

<!-- Touch surface: the left half becomes the stick, the right half the camera. -->
<div id="touch-layer"></div>

<!-- ------------------------------------------------------------------ HUD -->
<div id="hud">
  <div id="vitals">
    <div class="bar-wrap hp">
      <div id="bar-hp-chip" class="bar chip"></div>
      <div id="bar-hp" class="bar"></div>
      <span id="hp-text"></span>
    </div>
    <div class="bar-wrap fp"><div id="bar-fp" class="bar"></div></div>
    <div class="bar-wrap stam"><div id="bar-stam" class="bar"></div></div>
    <div id="status-meters"></div>
  </div>

  <div id="top-right">
    <canvas id="minimap" width="132" height="132"></canvas>
    <div id="compass"><div id="compass-strip"></div></div>
    <div id="load-indicator"></div>
  </div>

  <div id="souls-box">
    <span id="souls-value">0</span>
    <span id="souls-gain"></span>
  </div>

  <div id="objective-tracker" aria-live="polite">
    <span class="objective-kicker">現在の使命</span>
    <strong id="objective-name"></strong>
    <span id="objective-step"></span>
    <span id="objective-distance"></span>
  </div>

  <div id="objective-marker" aria-hidden="true"><i></i><span></span></div>
  <div id="tutorial-card" aria-live="polite"></div>
  <div id="save-indicator" aria-live="polite"><span>◆</span> 保存中</div>

  <div id="boss-bar">
    <div class="boss-name"></div>
    <div class="boss-track">
      <div class="boss-chip"></div>
      <div class="boss-fill"></div>
    </div>
  </div>

  <div id="region-title"></div>
  <div id="boss-intro"></div>
  <div id="boss-victory"></div>
  <div id="interact-prompt"></div>
  <div id="loot-popup"></div>
  <div id="notifications" aria-live="polite"></div>
  <div id="enemy-bars"></div>
  <div id="damage-layer"></div>
  <div id="lock-reticle"></div>
</div>

<!-- ------------------------------------------------------------- controls -->
<div id="controls">
  <div class="ctl-top-left">
    <button id="btn-menu" class="sys-btn" aria-label="メニュー">☰</button>
    <button id="btn-map" class="sys-btn" aria-label="地図">🗺</button>
  </div>

  <div class="ctl-flasks">
    <button id="btn-flask" class="flask-btn hp" aria-label="緋雫の瓶を使う">
      <span class="flask-icon"></span><span id="flask-count">0</span>
    </button>
    <button id="btn-flask-fp" class="flask-btn fp" aria-label="蒼雫の瓶を使う">
      <span class="flask-icon"></span><span id="flask-fp-count">0</span>
    </button>
  </div>

  <div class="ctl-quick">
    <button id="btn-switch-item" class="quick-slot" aria-label="使用する道具を切り替える">
      <span class="quick-tag">道具</span>
      <span id="quick-item-name">—</span>
      <span id="quick-item-count"></span>
    </button>
    <button id="btn-switch-spell" class="quick-slot" aria-label="使用する魔法を切り替える">
      <span class="quick-tag">魔法</span>
      <span id="quick-spell-name">—</span>
      <span id="quick-spell-cost"></span>
    </button>
  </div>

  <div class="ctl-cluster">
    <button id="btn-guard" class="act-btn guard" aria-label="ガードまたはパリィ"><span class="btn-label">ガード</span></button>
    <button id="btn-heavy" class="act-btn heavy" aria-label="強攻撃"><span class="btn-label">強</span></button>
    <button id="btn-attack" class="act-btn attack" aria-label="通常攻撃"><span class="btn-label">攻撃</span></button>
    <button id="btn-dodge" class="act-btn dodge" aria-label="回避。長押しでダッシュ"><span class="btn-label">回避</span></button>
  </div>

  <div class="ctl-side">
    <button id="btn-lock" class="small-btn" aria-label="敵をロックオン"><span class="btn-label">◎</span></button>
    <button id="btn-interact" class="small-btn interact" aria-label="調べる・話す"><span class="btn-label">調べる</span></button>
    <button id="btn-item" class="small-btn" aria-label="道具を使う"><span class="btn-label">使う</span></button>
    <button id="btn-spell" class="small-btn" aria-label="魔法を使う"><span class="btn-label">魔法</span></button>
    <button id="btn-jump" class="small-btn" aria-label="ジャンプ"><span class="btn-label">跳</span></button>
  </div>
</div>

<!-- --------------------------------------------------------------- overlay -->
<div id="overlay" class="overlay"></div>

<!-- --------------------------------------------------------------- loading -->
<div id="loading">
  <div class="load-inner">
    <h1>黒鉄の刻印</h1>
    <p class="load-sub">KUROGANE</p>
    <div class="load-track"><div id="load-bar"></div></div>
    <div class="load-meta">
      <span id="load-label">目を覚ましている</span>
      <span id="load-percent">0%</span>
    </div>
    <p id="load-tip" class="load-tip">世界はシード値から毎回すべて生成されます。地形・森・遺跡・敵の配置まで、ダウンロードは一切ありません。</p>
  </div>
</div>

<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((registration) => {
        registration.update().catch(() => {});
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new CustomEvent('kurogane-update-ready'));
            }
          });
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
