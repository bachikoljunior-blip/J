name: rev202 higher-arity right provenance smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/paired_bipartite_higher_arity_right_relation_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_paired_bipartite_higher_arity_right_relation_rev202.py'
      - 'automation_runs/2026-08-19_0851_JST/HIGHER_ARITY_RIGHT_PROVENANCE_AUDIT_REV202.md'
      - 'automation_runs/2026-08-19_0851_JST/CURRENT_STATUS_REV0202.json'
      - '.github/workflows/rev202-higher-arity-right-provenance-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev202:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate paired higher-arity right relation provenance
        run: python -m pytest -q test_paired_bipartite_higher_arity_right_relation_rev202.py
