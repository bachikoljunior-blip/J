name: rev290 SOJ normalized Johnson cost binding smoke

on:
  pull_request:
    paths:
      - '.github/workflows/rev290-soj-normalized-johnson-cost-binding-smoke.yml'
      - 'automation_runs/2026-08-22_1148_JST/REV290_SOJ_NORMALIZED_JOHNSON_COST_BINDING.md'
      - 'automation_runs/2026-08-22_1148_JST/corrected_soj_normalized_johnson_cost_binding_v1.py'
      - 'automation_runs/2026-08-22_1148_JST/test_corrected_soj_normalized_johnson_cost_binding_rev290.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile rev290
        run: |
          python -m py_compile \
            automation_runs/2026-08-22_1148_JST/corrected_soj_normalized_johnson_cost_binding_v1.py \
            automation_runs/2026-08-22_1148_JST/test_corrected_soj_normalized_johnson_cost_binding_rev290.py
      - name: Run focused regressions
        run: python automation_runs/2026-08-22_1148_JST/test_corrected_soj_normalized_johnson_cost_binding_rev290.py
      - name: Enforce reserved diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          changed="$(git diff --name-only origin/main...HEAD)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/rev290-soj-normalized-johnson-cost-binding-smoke.yml|automation_runs/2026-08-22_1148_JST/REV290_SOJ_NORMALIZED_JOHNSON_COST_BINDING.md|automation_runs/2026-08-22_1148_JST/corrected_soj_normalized_johnson_cost_binding_v1.py|automation_runs/2026-08-22_1148_JST/test_corrected_soj_normalized_johnson_cost_binding_rev290.py)
                ;;
              *)
                echo "unexpected non-rev290 path: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
