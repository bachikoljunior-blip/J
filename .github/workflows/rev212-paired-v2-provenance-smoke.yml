name: rev212 paired v2 provenance smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/paired_uniform_neighborhood_provenance_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_paired_uniform_neighborhood_provenance_rev212.py'
      - '.github/workflows/rev212-paired-v2-provenance-smoke.yml'

permissions:
  contents: read

jobs:
  rev212-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: python -m pytest -q test_paired_uniform_neighborhood_provenance_rev212.py
