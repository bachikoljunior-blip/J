name: rev218 execution linked accounting smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/bipartite_parent_action_coset_intersection_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/bipartite_parent_polynomial_lift_accounting_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/bipartite_parent_polynomial_lift_accounting_v2.py'
      - 'automation_runs/2026-08-19_0851_JST/test_execution_linked_polynomial_lift_proof_rev218.py'
      - '.github/workflows/rev218-execution-linked-accounting-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev218-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_execution_linked_polynomial_lift_proof_rev218.py
          test_bipartite_parent_polynomial_lift_accounting_rev207.py
          test_bipartite_parent_action_coset_intersection_rev206.py
          test_bounded_ground_s1_profile_filter_rev213.py
          test_shared_paired_action_candidate_artifact_rev217.py

