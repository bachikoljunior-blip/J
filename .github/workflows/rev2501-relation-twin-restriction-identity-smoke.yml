name: rev2501 relation-twin restriction identity smoke

on:
  pull_request:
    paths:
      - '.github/workflows/rev2501-relation-twin-restriction-identity-smoke.yml'
      - 'automation_runs/2026-08-22_1852_JST/REV2501_RELATION_TWIN_RESTRICTION_IDENTITY.md'
      - 'automation_runs/2026-08-22_1852_JST/relation_twin_restriction_identity_v1.py'
      - 'automation_runs/2026-08-22_1852_JST/test_relation_twin_restriction_identity_rev2501.py'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev2501-relation-twin-restriction-identity-20260822T185200JST-13b33de7-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical attempt-solution admission snapshot
        run: |
          rm -rf /tmp/rev2501-main-attempt
          git worktree add --detach /tmp/rev2501-main-attempt 27ea521d5e007a56275dcd50a3e7e1d61d302f10
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev2501-main-attempt \
            --claim-id chatgpt-session-j-rev2501-relation-twin-restriction-identity-20260822T185200JST-13b33de7 \
            --phase attempt_solution \
            --scope crx3/structural-consumers/relation-twin-restriction-replay-identity \
            --target-revision 2501 \
            --path .github/workflows/rev2501-relation-twin-restriction-identity-smoke.yml \
            --path automation_runs/2026-08-22_1852_JST/REV2501_RELATION_TWIN_RESTRICTION_IDENTITY.md \
            --path automation_runs/2026-08-22_1852_JST/relation_twin_restriction_identity_v1.py \
            --path automation_runs/2026-08-22_1852_JST/test_relation_twin_restriction_identity_rev2501.py \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev2501-relation-twin-restriction-identity-20260822T185200JST-13b33de7-attempt_solution.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev2501-relation-twin-restriction-identity-20260822T185200JST-13b33de7-publish.json \
            --output /tmp/rev2501-attempt-solution.json
          cat /tmp/rev2501-attempt-solution.json
      - name: Preserve generated attempt evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev2501-attempt-solution-evidence
          path: /tmp/rev2501-attempt-solution.json
          if-no-files-found: error
          retention-days: 1
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile rev2501 consumer and tests
        run: |
          python -m py_compile \
            automation_runs/2026-08-22_1852_JST/relation_twin_restriction_identity_v1.py \
            automation_runs/2026-08-22_1852_JST/test_relation_twin_restriction_identity_rev2501.py
      - name: Run inherited rev203 and focused rev2501 tests
        env:
          PYTHONPATH: automation_runs/2026-08-19_0851_JST:automation_runs/2026-08-22_1852_JST
        run: |
          python -m pytest -q \
            automation_runs/2026-08-19_0851_JST/test_relation_twin_restriction_provenance_rev203.py \
            automation_runs/2026-08-22_1852_JST/test_relation_twin_restriction_identity_rev2501.py
      - name: Reject sibling branch-only dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('automation_runs/2026-08-22_1852_JST/relation_twin_restriction_identity_v1.py').read_text()
          forbidden = (
              'corrected_soj',
              'homogeneous_block',
              'parent_filtered',
              'rev2200',
              'rev2300',
              'rev2400',
              'rev2500',
          )
          hits = [name for name in forbidden if name in text]
          if hits:
              raise SystemExit(f'branch-only/sibling dependency detected: {hits}')
          PY
      - name: Generate canonical publish admission snapshot
        run: |
          rm -rf /tmp/rev2501-main-publish
          git worktree add --detach /tmp/rev2501-main-publish 27ea521d5e007a56275dcd50a3e7e1d61d302f10
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev2501-main-publish \
            --claim-id chatgpt-session-j-rev2501-relation-twin-restriction-identity-20260822T185200JST-13b33de7 \
            --phase publish \
            --scope crx3/structural-consumers/relation-twin-restriction-replay-identity \
            --target-revision 2501 \
            --path .github/workflows/rev2501-relation-twin-restriction-identity-smoke.yml \
            --path automation_runs/2026-08-22_1852_JST/REV2501_RELATION_TWIN_RESTRICTION_IDENTITY.md \
            --path automation_runs/2026-08-22_1852_JST/relation_twin_restriction_identity_v1.py \
            --path automation_runs/2026-08-22_1852_JST/test_relation_twin_restriction_identity_rev2501.py \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev2501-relation-twin-restriction-identity-20260822T185200JST-13b33de7-attempt_solution.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev2501-relation-twin-restriction-identity-20260822T185200JST-13b33de7-publish.json \
            --output /tmp/rev2501-publish.json
          cat /tmp/rev2501-publish.json
      - name: Preserve generated publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev2501-publish-evidence
          path: /tmp/rev2501-publish.json
          if-no-files-found: error
          retention-days: 1
