name: rev200 Reduce-Part2-by-Color smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/bipartite_reduce_part2_by_color_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_bipartite_reduce_part2_by_color_rev200.py'
      - '.github/workflows/rev200-reduce-part2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev200:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate corrected Reduce-Part2-by-Color gate
        run: python -m pytest -q test_bipartite_reduce_part2_by_color_rev200.py
