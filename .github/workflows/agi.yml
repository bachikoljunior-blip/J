name: J AGI Loop

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      goal:
        description: Goal for this bounded J iteration
        required: true
        default: Improve general problem solving and preserve reproducible evidence
      provider:
        description: Planner provider
        required: true
        type: choice
        options:
          - auto
          - offline
          - openai
        default: auto

permissions:
  contents: read

concurrency:
  group: j-agi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install J
        run: pip install -e ".[openai]"
      - name: Environment doctor
        run: python -m j_agent --doctor
      - name: Acceptance tests
        run: python -m unittest discover -v
      - name: Critical proxy benchmarks
        run: python -m j_agent --benchmark
      - name: Run bounded autonomous iteration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          J_PROVIDER: ${{ github.event.inputs.provider || 'auto' }}
          J_GOAL: ${{ github.event.inputs.goal || 'Improve general problem solving, identify limitations, test alternatives, and preserve reproducible evidence inside this repository only' }}
        run: python -m j_agent --goal "$J_GOAL" --provider "$J_PROVIDER" --max-steps 8
      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j-evidence-${{ github.run_number }}
          path: |
            state/
            reports/
            workspace/
          if-no-files-found: warn
          retention-days: 14
