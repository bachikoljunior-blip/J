name: rev2000 homogeneous block joint compatibility proof-DAG smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "agi-gi-rev2000-homogeneous-block-joint-compatibility-proof-dag-session-20260822-1717"
    paths:
      - "automation_runs/2026-08-22_1717_JST/homogeneous_block_joint_compatibility_proof_dag_v1.py"
      - "automation_runs/2026-08-22_1717_JST/test_homogeneous_block_joint_compatibility_proof_dag_rev2000.py"
      - "automation_runs/2026-08-22_1717_JST/REV2000_HOMOGENEOUS_BLOCK_JOINT_COMPATIBILITY_PROOF_DAG.md"
      - ".github/workflows/rev2000-homogeneous-block-joint-compatibility-proof-dag-smoke.yml"
  pull_request:
    paths:
      - "automation_runs/2026-08-22_1717_JST/homogeneous_block_joint_compatibility_proof_dag_v1.py"
      - "automation_runs/2026-08-22_1717_JST/test_homogeneous_block_joint_compatibility_proof_dag_rev2000.py"
      - "automation_runs/2026-08-22_1717_JST/REV2000_HOMOGENEOUS_BLOCK_JOINT_COMPATIBILITY_PROOF_DAG.md"
      - ".github/workflows/rev2000-homogeneous-block-joint-compatibility-proof-dag-smoke.yml"

permissions:
  contents: write

concurrency:
  group: rev2000-homogeneous-block-joint-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rev2000-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate canonical attempt-solution and publish admission previews
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          attempt="${RUNNER_TEMP}/rev2000-attempt-solution.json"
          publish="${RUNNER_TEMP}/rev2000-publish.json"
          common=(
            --claim-id chatgpt-session-j-rev2000-homogeneous-block-joint-compatibility-proof-dag-20260822T171700JST-fb2787ee
            --scope crx3/structural-consumers/homogeneous-block-joint-reduction-compatibility-proof-dag
            --target-revision 2000
            --path .github/workflows/rev2000-homogeneous-block-joint-compatibility-proof-dag-smoke.yml
            --path automation_runs/2026-08-22_1717_JST/REV2000_HOMOGENEOUS_BLOCK_JOINT_COMPATIBILITY_PROOF_DAG.md
            --path automation_runs/2026-08-22_1717_JST/homogeneous_block_joint_compatibility_proof_dag_v1.py
            --path automation_runs/2026-08-22_1717_JST/test_homogeneous_block_joint_compatibility_proof_dag_rev2000.py
          )
          python automation/problem_solving_parallel_admission.py \
            "${common[@]}" \
            --phase attempt_solution \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev2000-homogeneous-block-joint-compatibility-proof-dag-20260822T171700JST-fb2787ee-attempt_solution.json \
            --output "${attempt}"
          python automation/problem_solving_parallel_admission.py \
            "${common[@]}" \
            --phase publish \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev2000-homogeneous-block-joint-compatibility-proof-dag-20260822T171700JST-fb2787ee-publish.json \
            --output "${publish}"
          jq -e '.admitted == true and .conflicts == []' "${attempt}"
          jq -e '.admitted == true and .conflicts == []' "${publish}"
          echo "attempt=${attempt}" >>"${GITHUB_OUTPUT}"
          echo "publish=${publish}" >>"${GITHUB_OUTPUT}"

      - name: Run focused rev2000 regressions
        run: >-
          python -m unittest
          automation_runs/2026-08-22_1717_JST/test_homogeneous_block_joint_compatibility_proof_dag_rev2000.py
          -v

      - name: Compile rev2000 implementation and tests
        run: >-
          python -m py_compile
          automation_runs/2026-08-22_1717_JST/homogeneous_block_joint_compatibility_proof_dag_v1.py
          automation_runs/2026-08-22_1717_JST/test_homogeneous_block_joint_compatibility_proof_dag_rev2000.py

      - name: Enforce main-integrated dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          file="automation_runs/2026-08-22_1717_JST/homogeneous_block_joint_compatibility_proof_dag_v1.py"
          grep -q "homogeneous_block_relation_provenance_v1" "${file}"
          grep -q "homogeneous_block_action_provenance_v1" "${file}"
          grep -q "homogeneous_block_action_kernel_v1" "${file}"
          grep -q "proof_dag_accounting_v1" "${file}"
          ! grep -Eq "joint_block_reduction_compatibility_v1|homogeneous_block_quotient_si|original_domain.*preimage|rev1800|rev276|rev278" "${file}"

      - name: Persist canonical attempt-solution and publish admission on this branch
        if: github.event_name == 'push'
        shell: bash
        env:
          ATTEMPT_PREVIEW: ${{ steps.admission.outputs.attempt }}
          PUBLISH_PREVIEW: ${{ steps.admission.outputs.publish }}
        run: |
          set -euo pipefail
          attempt="agi/run-history/phase-admissions/chatgpt-session-j-rev2000-homogeneous-block-joint-compatibility-proof-dag-20260822T171700JST-fb2787ee-attempt_solution.json"
          publish="agi/run-history/phase-admissions/chatgpt-session-j-rev2000-homogeneous-block-joint-compatibility-proof-dag-20260822T171700JST-fb2787ee-publish.json"
          mkdir -p "$(dirname "${attempt}")"
          cp "${ATTEMPT_PREVIEW}" "${attempt}"
          cp "${PUBLISH_PREVIEW}" "${publish}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${attempt}" "${publish}"
          if ! git diff --cached --quiet; then
            git commit -m "coordination: persist rev2000 attempt and publish admission"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
