name: rev215 replay-stable Johnson lift smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/johnson_ground_relational_lift_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_replay_stable_johnson_lift_memo_rev215.py'
      - '.github/workflows/rev215-replay-stable-johnson-lift-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev215-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_replay_stable_johnson_lift_memo_rev215.py
          test_general_log_pair_image_rev214.py
          test_bounded_ground_s1_profile_filter_rev213.py
          test_johnson_profile_candidate_bridge_rev212.py
          test_signed_johnson_log_codegree_image_rev211.py
