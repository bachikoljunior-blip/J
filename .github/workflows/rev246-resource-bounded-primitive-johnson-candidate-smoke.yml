name: rev246 resource-bounded primitive Johnson candidate smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  rev246-resource-bounded-primitive-johnson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - name: Run rev246 and inherited Johnson resource regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: >-
          python -m pytest -q
          test_resource_bounded_primitive_johnson_candidate_rev246.py
          test_design_nested_primitive_johnson_resource_rev243.py
          test_johnson_profile_candidate_bridge_rev212.py
      - name: Compile rev246 module and regression
        run: >-
          python -m py_compile
          automation_runs/2026-08-19_0851_JST/resource_bounded_primitive_johnson_candidate_si_v1.py
          automation_runs/2026-08-19_0851_JST/test_resource_bounded_primitive_johnson_candidate_rev246.py
