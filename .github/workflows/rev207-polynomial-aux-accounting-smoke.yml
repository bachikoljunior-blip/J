name: rev207 polynomial auxiliary accounting smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/bipartite_parent_polynomial_lift_accounting_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_bipartite_parent_polynomial_lift_accounting_rev207.py'
      - '.github/workflows/rev207-polynomial-aux-accounting-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev207-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: python -m pytest -q test_bipartite_parent_polynomial_lift_accounting_rev207.py
