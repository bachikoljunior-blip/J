name: rev259 original-domain relation preimage smoke

on:
  pull_request:
    paths:
      - automation_runs/2026-08-19_0851_JST/implicit_relation_image_action_v1.py
      - automation_runs/2026-08-19_0851_JST/implicit_relation_image_value_coset_v1.py
      - automation_runs/2026-08-19_0851_JST/implicit_relation_image_preimage_coset_v1.py
      - automation_runs/2026-08-19_0851_JST/test_implicit_relation_image_preimage_coset_rev259.py
      - automation_runs/2026-08-19_0851_JST/REV259_ORIGINAL_DOMAIN_PREIMAGE.md
      - .github/workflows/rev259-original-domain-preimage-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rev257-rev259 focused tests
        working-directory: automation_runs/2026-08-19_0851_JST
        run: python -m unittest -v test_implicit_relation_image_action_rev257.py test_implicit_relation_image_value_coset_rev258.py test_implicit_relation_image_preimage_coset_rev259.py
      - name: Compile rev259 implementation
        run: python -m py_compile automation_runs/2026-08-19_0851_JST/implicit_relation_image_preimage_coset_v1.py automation_runs/2026-08-19_0851_JST/test_implicit_relation_image_preimage_coset_rev259.py
