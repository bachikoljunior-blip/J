name: rev242 Design original-root ledger smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  rev242-design-original-root-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - name: Run rev242 and inherited Design resource regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: >-
          python -m pytest -q
          test_design_original_root_ledger_rev242.py
          test_design_union_reconstruction_resource_rev241.py
          test_design_state_orbit_cover_rev240.py
          test_design_full_string_child_preflight_rev236.py
      - name: Compile changed modules
        run: >-
          python -m py_compile
          automation_runs/2026-08-19_0851_JST/design_original_root_ledger_v1.py
          automation_runs/2026-08-19_0851_JST/colored_subset_design_branch_plan_v1.py
          automation_runs/2026-08-19_0851_JST/design_branch_tuple_transport_v1.py
          automation_runs/2026-08-19_0851_JST/design_tuple_full_string_union_si_v1.py
          automation_runs/2026-08-19_0851_JST/test_design_original_root_ledger_rev242.py
