name: rev209 signed Johnson candidate bridge smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/u2_candidate_coset_string_iso_v4.py'
      - 'automation_runs/2026-08-19_0851_JST/test_signed_johnson_candidate_bridge_rev209.py'
      - '.github/workflows/rev209-signed-johnson-candidate-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev209-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: python -m pytest -q test_signed_johnson_candidate_bridge_rev209.py
