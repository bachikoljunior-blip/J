name: rev192 H6 branch cost smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/design_lemma_branch_cost_certificate_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_design_lemma_branch_cost_rev192.py'
      - '.github/workflows/rev192-h6-branch-cost-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev192:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate Design branch quasipolynomial charge
        run: python -m pytest -q test_design_lemma_branch_cost_rev192.py
