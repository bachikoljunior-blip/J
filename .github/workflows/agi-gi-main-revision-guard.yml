name: AGI-GI main revision guard

on:
  push:
    branches: [main]
    paths:
      - MAIN.md
      - automation/agi_gi_main_revision_guard.py
      - automation/test_agi_gi_main_revision_guard.py
      - automation/problem_solving_parallel_admission.py
      - automation/test_problem_solving_parallel_admission.py
      - automation/problem_solving_phase_evidence_guard.py
      - automation/test_problem_solving_phase_evidence_guard.py
      - .github/workflows/agi-gi-main-revision-guard.yml
  pull_request:
    paths:
      - MAIN.md
      - automation/agi_gi_main_revision_guard.py
      - automation/test_agi_gi_main_revision_guard.py
      - automation/problem_solving_parallel_admission.py
      - automation/test_problem_solving_parallel_admission.py
      - automation/problem_solving_phase_evidence_guard.py
      - automation/test_problem_solving_phase_evidence_guard.py
      - .github/workflows/agi-gi-main-revision-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run revision guard regressions
        run: |
          python -m unittest \
            automation/test_agi_gi_main_revision_guard.py \
            automation/test_parallel_claims.py \
            automation/test_problem_solving_parallel_admission.py \
            automation/test_problem_solving_phase_evidence_guard.py
      - name: Verify canonical continuation point
        run: python automation/agi_gi_main_revision_guard.py --ref HEAD
