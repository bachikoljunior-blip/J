name: rev257 implicit relation-image paired action smoke

on:
  pull_request:
    paths:
      - automation_runs/2026-08-19_0851_JST/implicit_relation_image_action_v1.py
      - automation_runs/2026-08-19_0851_JST/test_implicit_relation_image_action_rev257.py
      - automation_runs/2026-08-19_0851_JST/REV257_IMPLICIT_RELATION_IMAGE_ACTION.md
      - .github/workflows/rev257-implicit-relation-image-action-smoke.yml
      - agi/run-history/phase-admissions/**rev257-implicit-action**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rev257 focused tests
        working-directory: automation_runs/2026-08-19_0851_JST
        run: python -m unittest -v test_implicit_relation_image_action_rev257.py
      - name: Compile rev257 implementation
        run: python -m py_compile automation_runs/2026-08-19_0851_JST/implicit_relation_image_action_v1.py
