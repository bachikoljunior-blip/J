name: rev289 proof-DAG envelope hardening smoke

on:
  pull_request:
    paths:
      - "automation_runs/2026-08-19_0851_JST/proof_dag_accounting_v1.py"
      - "automation_runs/2026-08-19_0851_JST/test_proof_dag_envelope_input_validation_rev289.py"
      - "automation_runs/2026-08-19_0851_JST/REV289_PROOF_DAG_ENVELOPE_HARDENING.md"
      - ".github/workflows/rev289-proof-dag-envelope-hardening-smoke.yml"
      - "agi/run-history/phase-admissions/chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79-*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate canonical attempt-solution admission snapshot
        run: |
          git fetch --no-tags origin main
          rm -rf /tmp/rev289-main
          git worktree add --detach /tmp/rev289-main origin/main
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev289-main \
            --claim-id chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79 \
            --phase attempt_solution \
            --scope crx3/shared-proof-dag/strict-envelope-input-validation \
            --target-revision 289 \
            --path .github/workflows/rev289-proof-dag-envelope-hardening-smoke.yml \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79-attempt-solution.json \
            --path automation_runs/2026-08-19_0851_JST/REV289_PROOF_DAG_ENVELOPE_HARDENING.md \
            --path automation_runs/2026-08-19_0851_JST/proof_dag_accounting_v1.py \
            --path automation_runs/2026-08-19_0851_JST/test_proof_dag_envelope_input_validation_rev289.py \
            --output /tmp/rev289-attempt-solution.json
      - name: Preserve generated attempt admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev289-attempt-solution-evidence
          path: /tmp/rev289-attempt-solution.json
          if-no-files-found: error
          retention-days: 1
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Compile shared validator and rev289 regression
        run: |
          cd automation_runs/2026-08-19_0851_JST
          python -m py_compile proof_dag_accounting_v1.py test_proof_dag_envelope_input_validation_rev289.py
      - name: Run inherited rev220 and focused rev289 proof-DAG tests
        run: |
          cd automation_runs/2026-08-19_0851_JST
          python -m pytest -q test_proof_dag_accounting_rev220.py test_proof_dag_envelope_input_validation_rev289.py
      - name: Reject branch-only sibling dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("automation_runs/2026-08-19_0851_JST/proof_dag_accounting_v1.py")
          text = path.read_text()
          forbidden = (
              "parent_outcome_proof_dag",
              "literal_giant_proof_dag",
              "corrected_soj",
              "homogeneous_block_action_kernel_v1",
          )
          hits = [name for name in forbidden if name in text]
          if hits:
              raise SystemExit(f"branch-only/sibling dependency detected: {hits}")
          PY
      - name: Generate canonical publish admission snapshot
        run: |
          git fetch --no-tags origin main
          rm -rf /tmp/rev289-main-publish
          git worktree add --detach /tmp/rev289-main-publish origin/main
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev289-main-publish \
            --claim-id chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79 \
            --phase publish \
            --scope crx3/shared-proof-dag/strict-envelope-input-validation \
            --target-revision 289 \
            --path .github/workflows/rev289-proof-dag-envelope-hardening-smoke.yml \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79-attempt-solution.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79-publish.json \
            --path automation_runs/2026-08-19_0851_JST/REV289_PROOF_DAG_ENVELOPE_HARDENING.md \
            --path automation_runs/2026-08-19_0851_JST/proof_dag_accounting_v1.py \
            --path automation_runs/2026-08-19_0851_JST/test_proof_dag_envelope_input_validation_rev289.py \
            --output /tmp/rev289-publish.json
      - name: Preserve generated publish admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev289-publish-evidence
          path: /tmp/rev289-publish.json
          if-no-files-found: error
          retention-days: 1
      - name: Generate canonical merge admission snapshot
        run: |
          git fetch --no-tags origin main
          rm -rf /tmp/rev289-main-merge
          git worktree add --detach /tmp/rev289-main-merge origin/main
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev289-main-merge \
            --claim-id chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79 \
            --phase merge \
            --scope crx3/shared-proof-dag/strict-envelope-input-validation \
            --target-revision 289 \
            --path .github/workflows/rev289-proof-dag-envelope-hardening-smoke.yml \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79-attempt-solution.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79-publish.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev289-proof-dag-envelope-hardening-20260822T1146JST-6ed2fa79-merge.json \
            --path automation_runs/2026-08-19_0851_JST/REV289_PROOF_DAG_ENVELOPE_HARDENING.md \
            --path automation_runs/2026-08-19_0851_JST/proof_dag_accounting_v1.py \
            --path automation_runs/2026-08-19_0851_JST/test_proof_dag_envelope_input_validation_rev289.py \
            --output /tmp/rev289-merge.json
      - name: Preserve generated merge admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev289-merge-evidence
          path: /tmp/rev289-merge.json
          if-no-files-found: error
          retention-days: 1
