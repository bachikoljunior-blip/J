name: rev221 local-certificate exact TWL Design smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/local_certificate_exact_twl_design_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_local_certificate_exact_twl_design_rev221.py'
      - '.github/workflows/rev221-local-certificate-exact-twl-design-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev221-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_local_certificate_exact_twl_design_rev221.py
          test_aggregate_local_certificate_relation.py
          test_colored_subset_exact_twl_design_rev193.py
          test_design_lemma_exact_twl_candidate_rev194.py
          test_relation_twin_design_wiring_rev204.py
