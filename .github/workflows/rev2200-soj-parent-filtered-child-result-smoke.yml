name: rev2200 SOJ parent-filtered child result smoke

on:
  push:
    branches:
      - agi-gi-rev2200-soj-parent-filtered-child-result-session-20260822-1747
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rev2200-soj-parent-filtered-child-result-smoke.yml'
      - 'automation_runs/2026-08-22_1747_JST/REV2200_SOJ_PARENT_FILTERED_CHILD_RESULT.md'
      - 'automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py'
      - 'automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85-attempt-solution.json'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85-publish.json'

permissions:
  contents: write

concurrency:
  group: rev2200-soj-parent-filtered-child-result-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: automation_runs/2026-08-22_1747_JST
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile rev2200 module and tests
        run: |
          python -m py_compile \
            automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py \
            automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py
      - name: Run rev2200 focused regressions
        run: python automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py
      - name: Reject sibling branch-only implementation imports
        shell: bash
        run: |
          set -euo pipefail
          target=automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py
          ! grep -nE '^[[:space:]]*(from|import)[[:space:]].*(soj_child_semantic_reduction_binding_v1|soj_recursive_child_instance_execution_v1)' "$target"
      - name: Canonical attempt_solution admission preview
        shell: bash
        run: |
          set -euo pipefail
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85 \
            --phase attempt_solution \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-parent-filtered-child-result-binding \
            --target-revision 2200 \
            --path .github/workflows/rev2200-soj-parent-filtered-child-result-smoke.yml \
            --path automation_runs/2026-08-22_1747_JST/REV2200_SOJ_PARENT_FILTERED_CHILD_RESULT.md \
            --path automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py \
            --path automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py \
            --output /tmp/rev2200-attempt.json
          test -s /tmp/rev2200-attempt.json
          cat /tmp/rev2200-attempt.json
      - name: Canonical publish admission preview
        shell: bash
        run: |
          set -euo pipefail
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85 \
            --phase publish \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-parent-filtered-child-result-binding \
            --target-revision 2200 \
            --path .github/workflows/rev2200-soj-parent-filtered-child-result-smoke.yml \
            --path automation_runs/2026-08-22_1747_JST/REV2200_SOJ_PARENT_FILTERED_CHILD_RESULT.md \
            --path automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py \
            --path automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py \
            --output /tmp/rev2200-publish.json
          test -s /tmp/rev2200-publish.json
          cat /tmp/rev2200-publish.json
      - name: Enforce reserved rev2200 diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only "$base" HEAD > /tmp/rev2200-changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/rev2200-soj-parent-filtered-child-result-smoke.yml',
              'automation_runs/2026-08-22_1747_JST/REV2200_SOJ_PARENT_FILTERED_CHILD_RESULT.md',
              'automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py',
              'automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85-attempt-solution.json',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85-publish.json',
          }
          expected = {
              '.github/workflows/rev2200-soj-parent-filtered-child-result-smoke.yml',
              'automation_runs/2026-08-22_1747_JST/REV2200_SOJ_PARENT_FILTERED_CHILD_RESULT.md',
              'automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py',
              'automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py',
          }
          changed = {line.strip() for line in Path('/tmp/rev2200-changed.txt').read_text().splitlines() if line.strip()}
          extra = sorted(changed - allowed)
          missing = sorted(expected - changed)
          assert not extra, f'unreserved rev2200 paths changed: {extra}'
          assert not missing, f'missing expected rev2200 paths: {missing}'
          print('reserved-path diff ok:', sorted(changed))
          PY
      - name: Materialize canonical attempt_solution admission after green smoke
        if: github.event_name == 'push'
        shell: bash
        env:
          EVIDENCE: agi/run-history/phase-admissions/chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85-attempt-solution.json
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE" ]]; then
            echo 'canonical attempt_solution evidence already present; no branch mutation'
          else
            python automation/problem_solving_parallel_admission.py \
              --claim-id chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85 \
              --phase attempt_solution \
              --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-parent-filtered-child-result-binding \
              --target-revision 2200 \
              --path .github/workflows/rev2200-soj-parent-filtered-child-result-smoke.yml \
              --path automation_runs/2026-08-22_1747_JST/REV2200_SOJ_PARENT_FILTERED_CHILD_RESULT.md \
              --path automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py \
              --path automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py \
              --output "$EVIDENCE"
            test -s "$EVIDENCE"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$EVIDENCE"
            git commit -m 'coordination: add rev2200 attempt-solution admission evidence'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Materialize canonical publish admission after green smoke
        if: github.event_name == 'push'
        shell: bash
        env:
          EVIDENCE: agi/run-history/phase-admissions/chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85-publish.json
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE" ]]; then
            echo 'canonical publish evidence already present; no branch mutation'
            exit 0
          fi
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev2200-soj-parent-filtered-child-result-20260822T174730JST-6a2bef85 \
            --phase publish \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-parent-filtered-child-result-binding \
            --target-revision 2200 \
            --path .github/workflows/rev2200-soj-parent-filtered-child-result-smoke.yml \
            --path automation_runs/2026-08-22_1747_JST/REV2200_SOJ_PARENT_FILTERED_CHILD_RESULT.md \
            --path automation_runs/2026-08-22_1747_JST/soj_parent_filtered_child_result_v1.py \
            --path automation_runs/2026-08-22_1747_JST/test_soj_parent_filtered_child_result_rev2200.py \
            --output "$EVIDENCE"
          test -s "$EVIDENCE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVIDENCE"
          git commit -m 'coordination: add rev2200 publish admission evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
