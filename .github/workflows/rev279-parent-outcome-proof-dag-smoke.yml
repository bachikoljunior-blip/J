name: rev279 parent outcome proof-DAG smoke

on:
  pull_request:
    paths:
      - automation_runs/2026-08-19_0851_JST/implicit_relation_parent_outcome_proof_dag_v1.py
      - automation_runs/2026-08-19_0851_JST/test_implicit_relation_parent_outcome_proof_dag_rev279.py
      - automation_runs/2026-08-19_0851_JST/REV279_PARENT_OUTCOME_PROOF_DAG.md
      - agi/run-history/phase-admissions/chatgpt-session-j-rev279-parent-outcome-proof-dag-20260822T094800JST-15932427-attempt-solution.json
      - agi/run-history/phase-admissions/chatgpt-session-j-rev279-parent-outcome-proof-dag-20260822T094800JST-15932427-publish.json
      - agi/run-history/phase-admissions/chatgpt-session-j-rev279-parent-outcome-proof-dag-20260822T094800JST-15932427-merge.json
      - .github/workflows/rev279-parent-outcome-proof-dag-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited proof-DAG dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run rev279 focused and inherited regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: >-
          python -m unittest -v
          test_implicit_relation_parent_outcome_rev266.py
          test_proof_dag_accounting_rev220.py
          test_implicit_relation_parent_outcome_proof_dag_rev279.py
      - name: Compile rev279 consumer
        run: >-
          python -m py_compile
          automation_runs/2026-08-19_0851_JST/implicit_relation_parent_outcome_proof_dag_v1.py
          automation_runs/2026-08-19_0851_JST/test_implicit_relation_parent_outcome_proof_dag_rev279.py
      - name: Enforce additive main-integrated dependency boundary
        run: |
          set -euo pipefail
          file=automation_runs/2026-08-19_0851_JST/implicit_relation_parent_outcome_proof_dag_v1.py
          grep -q 'implicit_relation_parent_outcome_v1' "$file"
          grep -q 'proof_dag_accounting_v1' "$file"
          ! grep -E 'homogeneous_block|imprimitive_resource_proof_dag|implicit_image_value_proof_dag_consumer|primitive_johnson_proof_dag_consumer|proof_carrying_state_orbit_candidate' "$file"
      - name: Preview canonical attempt, publish, and merge admission from merge-base registry
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/${REPOSITORY}/commits/${MERGE_SHA}" --jq '.parents[0].sha')"
          test "${#source_sha}" -eq 40
          python - "${source_sha}" <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          from automation.parallel_claims import JST, load_registry
          from automation.problem_solving_parallel_admission import (
              admit_problem_phase,
              evidence_payload,
              validate_evidence_payload,
          )

          source_sha = sys.argv[1]
          claims, errors = load_registry(Path.cwd())
          if errors:
              raise SystemExit("registry errors: " + "; ".join(errors))
          paths = (
              ".github/workflows/rev279-parent-outcome-proof-dag-smoke.yml",
              "automation_runs/2026-08-19_0851_JST/REV279_PARENT_OUTCOME_PROOF_DAG.md",
              "automation_runs/2026-08-19_0851_JST/implicit_relation_parent_outcome_proof_dag_v1.py",
              "automation_runs/2026-08-19_0851_JST/test_implicit_relation_parent_outcome_proof_dag_rev279.py",
          )
          for phase, marker in (
              ("attempt_solution", "REV279_ATTEMPT_EVIDENCE"),
              ("publish", "REV279_PUBLISH_EVIDENCE"),
              ("merge", "REV279_MERGE_EVIDENCE"),
          ):
              now = datetime.now(JST)
              result = admit_problem_phase(
                  claims,
                  claim_id="chatgpt-session-j-rev279-parent-outcome-proof-dag-20260822T094800JST-15932427",
                  phase=phase,
                  scope="crx3/algorithmic-consumers/implicit-relation-parent-outcome-proof-dag",
                  target_revision=279,
                  now=now,
                  registry_source_sha=source_sha,
                  paths=paths,
              )
              if not result["admitted"]:
                  raise SystemExit(f"{phase} admission denied: " + json.dumps(result, sort_keys=True))
              payload = evidence_payload(result, now)
              validation_errors = validate_evidence_payload(payload)
              if validation_errors:
                  raise SystemExit(f"{phase} evidence validation failed: " + "; ".join(validation_errors))
              print(marker + "_BEGIN")
              print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
              print(marker + "_END")
          PY
