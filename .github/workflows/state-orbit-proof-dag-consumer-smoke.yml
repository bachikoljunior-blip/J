name: state-orbit proof-DAG consumer smoke

on:
  pull_request:
    paths:
      - "automation_runs/2026-08-19_0851_JST/proof_carrying_state_orbit_candidate_v1.py"
      - "automation_runs/2026-08-19_0851_JST/test_state_orbit_proof_dag_consumer_v1.py"
      - ".github/workflows/state-orbit-proof-dag-consumer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - run: >-
          pytest -q
          automation_runs/2026-08-19_0851_JST/test_state_orbit_candidate_terminal_rev239.py
          automation_runs/2026-08-19_0851_JST/test_proof_dag_accounting_rev220.py
          automation_runs/2026-08-19_0851_JST/test_state_orbit_proof_dag_consumer_v1.py
