version: 0
status: draft
claim: "practically usable AGI"
freeze_policy:
  candidate: immutable_for_final_run
  thresholds: preregister_before_final_run
  tasks: held_out_or_freshly_generated
required_gates:
  - generality
  - performance
  - autonomy
  - practical_delivery
  - evidence_integrity

domains:
  - language_knowledge
  - mathematics
  - software_engineering
  - data_analysis
  - planning_decision
  - novel_task_induction

rules:
  max_domain_weight: 0.25
  aggregation: macro
  failed_required_domain_can_be_averaged_away: false
  report_uncertainty: true
  record_failures: true

performance_reference:
  population: competent_humans
  threshold_definition: preregistered_per_task_family
  require_each_family_pass: true
  require_macro_pass: true

autonomy_metrics:
  - completion_rate
  - intervention_count
  - recovery_rate
  - elapsed_time
  - resource_cost
  - policy_violations
  - state_persistence_success

practical_delivery_requirements:
  - third_party_runnable
  - documented_interface
  - reproducible_environment
  - explicit_resource_requirements
  - observable_logs
  - repeatable_acceptance_test

evidence_integrity:
  record:
    - candidate_identifier
    - task_identifier
    - task_generator_version
    - seed
    - configuration
    - tool_trace
    - outputs
    - scores
    - failures
  independent_rerun_required: true
  contamination_invalidates_affected_result: true

final_claim_rule: "claim AGI only when every required gate passes on the frozen candidate with auditable evidence"
