name: rev266 implicit relation parent outcome smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/rev266-implicit-relation-parent-outcome-smoke.yml"
      - "automation_runs/2026-08-19_0851_JST/REV266_IMPLICIT_RELATION_PARENT_OUTCOME_CONTRACT.md"
      - "automation_runs/2026-08-19_0851_JST/implicit_relation_parent_outcome_v1.py"
      - "automation_runs/2026-08-19_0851_JST/test_implicit_relation_parent_outcome_rev266.py"

permissions:
  contents: read

jobs:
  rev266-parent-outcome-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run focused rev266 contract regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: python test_implicit_relation_parent_outcome_rev266.py -v

      - name: Compile rev266 implementation and regression
        working-directory: automation_runs/2026-08-19_0851_JST
        run: >-
          python -m py_compile
          implicit_relation_parent_outcome_v1.py
          test_implicit_relation_parent_outcome_rev266.py

      - name: Assert evidence-only dependency boundary
        working-directory: automation_runs/2026-08-19_0851_JST
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'from (implicit_relation_image_parent_promotion_v1|implicit_relation_parent_exact_empty_v1)|import (implicit_relation_image_parent_promotion_v1|implicit_relation_parent_exact_empty_v1)' implicit_relation_parent_outcome_v1.py
          grep -q 'NONEMPTY_SOURCE_REVISION = 261' implicit_relation_parent_outcome_v1.py
          grep -q 'EXACT_EMPTY_SOURCE_REVISION = 263' implicit_relation_parent_outcome_v1.py
