name: rev195 Design recurrence progress smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/design_twl_recurrence_progress_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_design_twl_recurrence_progress_rev195.py'
      - '.github/workflows/rev195-design-recurrence-progress-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev195:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate Design output to recurrence progress bridge
        run: python -m pytest -q test_design_twl_recurrence_progress_rev195.py
