name: rev242 Design pipeline admission smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  rev242-design-pipeline-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - name: Run shared pipeline and inherited resource regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: >-
          python -m pytest -q
          test_design_pipeline_admission_rev242.py
          test_correlated_twl_resource_rev232.py
          test_design_tuple_transport_resource_rev233.py
          test_design_state_orbit_cover_rev240.py
          test_design_union_reconstruction_resource_rev241.py
      - name: Compile changed modules
        run: >-
          python -m py_compile
          automation_runs/2026-08-19_0851_JST/design_pipeline_admission_ledger_v1.py
          automation_runs/2026-08-19_0851_JST/design_lemma_exact_twl_candidate_si_v1.py
          automation_runs/2026-08-19_0851_JST/test_design_pipeline_admission_rev242.py
