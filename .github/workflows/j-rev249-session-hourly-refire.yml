name: J rev249 session hourly re-fire

on:
  schedule:
    - cron: "02 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/j-rev249-session-hourly-refire.yml"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: j-rev249-session-hourly-refire-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  re-fire-stale-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect stale rev249 session activity
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_PATH: agi/run-history/active/chatgpt-session-j-rev249-20260821T220205JST-f3a215ea.json
          BRANCH: agi-gi-rev249-design-child-proof-dag-cover-session-20260821-2202
          STALE_AFTER_MINUTES: "55"
        run: |
          set -euo pipefail

          now_epoch="$(date -u +%s)"
          cutoff_epoch="$((now_epoch - STALE_AFTER_MINUTES * 60))"

          claim_json="$(
            gh api "repos/${REPOSITORY}/contents/${CLAIM_PATH}?ref=main" \
              --jq '.content' | tr -d '\n' | base64 --decode
          )"
          claim_status="$(jq -r '.status' <<<"${claim_json}")"
          heartbeat="$(jq -r '.heartbeat_at_jst // .started_at_jst' <<<"${claim_json}")"
          heartbeat_epoch="$(date -d "${heartbeat}" +%s)"

          branch_epoch=0
          if branch_date="$(
            gh api "repos/${REPOSITORY}/commits/${BRANCH}" \
              --jq '.commit.committer.date // .commit.author.date' 2>/dev/null
          )"; then
            branch_epoch="$(date -d "${branch_date}" +%s)"
          fi

          owner="${REPOSITORY%%/*}"
          pr_epoch=0
          pr_updated="$(
            gh api "repos/${REPOSITORY}/pulls?state=open&head=${owner}:${BRANCH}&per_page=1" \
              --jq '.[0].updated_at // empty'
          )"
          if [[ -n "${pr_updated}" ]]; then
            pr_epoch="$(date -d "${pr_updated}" +%s)"
          fi

          latest_epoch="${heartbeat_epoch}"
          (( branch_epoch > latest_epoch )) && latest_epoch="${branch_epoch}"
          (( pr_epoch > latest_epoch )) && latest_epoch="${pr_epoch}"

          stale=false
          reason="session activity is fresh"
          if [[ "${claim_status}" != "active" ]]; then
            reason="claim is ${claim_status}; no re-fire is needed"
          elif (( latest_epoch < cutoff_epoch )); then
            stale=true
            reason="no claim heartbeat, branch commit, or PR update was seen within ${STALE_AFTER_MINUTES} minutes"
          fi

          echo "stale=${stale}" >>"${GITHUB_OUTPUT}"
          echo "reason=${reason}" >>"${GITHUB_OUTPUT}"
          {
            echo "### J rev249 session guard"
            echo "- Claim status: ${claim_status}"
            echo "- Claim heartbeat: ${heartbeat}"
            echo "- Branch activity epoch: ${branch_epoch}"
            echo "- PR activity epoch: ${pr_epoch}"
            echo "- Decision: ${reason}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Emit durable rev249 continuation request
        if: github.event_name != 'pull_request' && steps.guard.outputs.stale == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAIM_PATH: agi/run-history/active/chatgpt-session-j-rev249-20260821T220205JST-f3a215ea.json
          BRANCH: agi-gi-rev249-design-child-proof-dag-cover-session-20260821-2202
        run: |
          set -euo pipefail

          title="[automation] J rev249 session re-fire queue"
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          issue_number="$(
            gh issue list --repo "${REPOSITORY}" --state open --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n 1
          )"

          message="Hourly rev249 continuation re-fire requested at ${timestamp}. Reconstruct this session from ${CLAIM_PATH} and branch ${BRANCH}, then follow automation/CHATGPT_SCHEDULED_TASK_RUNBOOK.md. Preserve every other active claim, branch, PR, and workflow. Trigger: ${RUN_URL}"

          if [[ -z "${issue_number}" ]]; then
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${message}"
          else
            gh issue comment "${issue_number}" --repo "${REPOSITORY}" --body "${message}"
          fi
