name: rev196 structural recurrence smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/quasipoly_structural_recurrence_accounting_v2.py'
      - 'automation_runs/2026-08-19_0851_JST/test_quasipoly_structural_recurrence_rev196.py'
      - '.github/workflows/rev196-structural-recurrence-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev196:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate structural recurrence accounting
        run: python -m pytest -q test_quasipoly_structural_recurrence_rev196.py
