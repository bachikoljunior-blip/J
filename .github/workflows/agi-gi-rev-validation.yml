name: AGI-GI rev validation

on:
  push:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/**'
      - '.github/workflows/agi-gi-rev-validation.yml'
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/**'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

concurrency:
  group: agi-gi-rev-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-w1r-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate signed-ground W1R image plumbing
        run: >-
          python -m pytest -q
          test_signed_johnson_ground_pair_relation_si_rev178.py
          test_signed_johnson_ground_pair_orbit_si_rev178.py
          test_paired_action_coset_preimage_rev179.py
          test_signed_johnson_complement_safe_image_si_rev180.py
          test_signed_johnson_relation_image_candidate_si_rev181.py
          test_signed_johnson_relation_arity_selector_rev182.py
          test_signed_johnson_joint_relation_candidate_si_rev183.py
          test_signed_johnson_log_certificate_design_descent_rev184.py
          test_colored_subset_symmetry_defect_rev185.py
          test_colored_subset_design_witness_rev186.py
          test_colored_subset_design_branch_plan_rev187.py
          test_design_branch_tuple_transport_rev188.py
          test_design_tuple_full_string_union_rev189.py

  validate-rev-series:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate current regular-prime terminal and master integration
        run: >-
          python -m pytest -q
          test_regular_prime_cyclic_terminal.py
          test_master_canonical_reduction_v5.py
      - name: Validate Babai recurrence contract and current W1R Design path
        run: >-
          python -m pytest -q
          test_babai_recurrence_contract_v1.py
          test_local_certificate_recurrence_adapter_v1.py
          test_canonical_partition_transporter_v1.py
          test_canonical_local_partition_iso_coset_v1.py
          test_canonical_partition_guided_string_iso_v1.py
          test_partition_guided_end_to_end_rev149.py
          test_quasipoly_recurrence_accounting_v1.py
          test_block_action_preimage_coset_v1.py
          test_kernel_lifted_local_fullness_v1.py
          test_affected_kernel_recurrence_plan_v1.py
          test_orbit_action_preimage_coset_v1.py
          test_orbit_factored_string_coset_intersection_v1.py
          test_kernel_lifted_local_fullness_v2.py
          test_unaffected_stabilizer_reduction_v1.py
          test_babai_local_certificate_parameter_gate_v1.py
          test_kernel_lifted_local_fullness_v3.py
          test_orbit_factored_partial_string_coset_intersection_v1.py
          test_affected_segment_automorphism_v1.py
          test_quotient_factored_partial_string_intersection_v1.py
          test_local_certificate_beard_v1.py
          test_proof_carrying_si_v1.py
          test_orbit_factored_partial_string_coset_intersection_v2.py
          test_s1_structural_classifier_v1.py
          test_s1_string_isomorphism_v1.py
          test_u2_imprimitive_small_quotient_v1.py
          test_v2_imprimitive_small_image_v1.py
          test_proof_carrying_small_order_si_v1.py
          test_candidate_small_order_recursive_v2.py
          test_candidate_transitive_imprimitive_rev172.py
          test_primitive_johnson_ground_terminal_rev173.py
          test_johnson_k_ground_rev174.py
          test_johnson_ground_relational_lift_rev175.py
          test_signed_johnson_ground_relational_si_rev176.py
          test_signed_johnson_ground_profile_partition_si_rev177.py
          test_signed_johnson_ground_pair_relation_si_rev178.py
          test_signed_johnson_ground_pair_orbit_si_rev178.py
          test_paired_action_coset_preimage_rev179.py
          test_signed_johnson_complement_safe_image_si_rev180.py
          test_signed_johnson_relation_image_candidate_si_rev181.py
          test_signed_johnson_relation_arity_selector_rev182.py
          test_signed_johnson_joint_relation_candidate_si_rev183.py
          test_signed_johnson_log_certificate_design_descent_rev184.py
          test_colored_subset_symmetry_defect_rev185.py
          test_colored_subset_design_witness_rev186.py
          test_colored_subset_design_branch_plan_rev187.py
          test_design_branch_tuple_transport_rev188.py
          test_design_tuple_full_string_union_rev189.py
          test_design_lemma_candidate_si_rev190.py
          test_signed_johnson_log_design_lemma_rev191.py
          test_design_lemma_branch_cost_rev192.py
          test_colored_subset_exact_twl_design_rev193.py
          test_design_lemma_exact_twl_candidate_rev194.py
          test_design_twl_recurrence_progress_rev195.py
          test_upcc_subconstituent_split_family_rev197.py
          test_bipartite_parent_polynomial_lift_accounting_rev207.py
          test_literal_giant_candidate_si_rev208.py
          test_johnson_log_candidate_bridge_rev209.py
          test_canonical_imprimitive_family_candidate_si_rev210.py
      - name: Install independent canonical oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y nauty
          command -v nauty-labelg || command -v labelg
      - name: Run labelg-backed differential gate
        run: python -m pytest -q test_nauty_labelg_differential_rev141.py
