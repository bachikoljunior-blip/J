name: rev202 bipartite degree smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/bipartite_degree_alpha_partition_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_bipartite_degree_alpha_partition_rev202.py'
      - '.github/workflows/rev202-bipartite-degree-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev202:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate canonical degree split and dominant uniform cell gate
        run: python -m pytest -q test_bipartite_degree_alpha_partition_rev202.py
