name: rev242 Design original-root pipeline resource smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  rev242-design-pipeline-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - name: Run shared pipeline ledger and inherited Design regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: >-
          python -m pytest -q
          test_design_original_root_pipeline_resource_rev242.py
          test_design_union_reconstruction_resource_rev241.py
          test_design_state_orbit_cover_rev240.py
          test_design_lemma_exact_twl_candidate_rev194.py
      - name: Compile changed modules
        run: >-
          python -m py_compile
          automation_runs/2026-08-19_0851_JST/design_original_root_pipeline_resource_v1.py
          automation_runs/2026-08-19_0851_JST/design_lemma_exact_twl_candidate_si_v1.py
          automation_runs/2026-08-19_0851_JST/test_design_original_root_pipeline_resource_rev242.py
