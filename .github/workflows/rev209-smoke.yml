name: rev209 Johnson joint dispatch smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/u2_candidate_coset_string_iso_v3.py'
      - 'automation_runs/2026-08-19_0851_JST/test_candidate_johnson_joint_dispatch_rev209.py'
      - '.github/workflows/rev209-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev209-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate rev209 Johnson routes with visible per-test progress
        run: python -m pytest -vv test_candidate_johnson_joint_dispatch_rev209.py
      - name: Preserve rev208 literal-giant regression
        run: python -m pytest -q test_literal_giant_candidate_si_rev208.py
