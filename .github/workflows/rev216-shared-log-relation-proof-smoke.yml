name: rev216 shared log relation proof smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/signed_johnson_log_certificate_design_descent_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/signed_johnson_log_codegree_image_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/coherent_pair_refinement.py'
      - 'automation_runs/2026-08-19_0851_JST/test_coherent_pair_refinement.py'
      - 'automation_runs/2026-08-19_0851_JST/test_shared_log_relation_artifact_rev216.py'
      - '.github/workflows/rev216-shared-log-relation-proof-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev216-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_coherent_pair_refinement.py
          test_shared_log_relation_artifact_rev216.py
          test_replay_stable_johnson_lift_memo_rev215.py
          test_general_log_pair_image_rev214.py
          test_bounded_ground_s1_profile_filter_rev213.py
          test_johnson_profile_candidate_bridge_rev212.py
