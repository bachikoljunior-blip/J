name: rev244 imprimitive quotient-kernel resource smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/imprimitive_quotient_kernel_resource_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/resource_bounded_imprimitive_candidate_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/u2_candidate_coset_string_iso_v8.py'
      - 'automation_runs/2026-08-19_0851_JST/test_imprimitive_quotient_kernel_resource_rev244.py'
      - 'automation_runs/2026-08-19_0851_JST/REV244_IMPRIMITIVE_RESOURCE_AUDIT.md'
      - '.github/workflows/rev244-imprimitive-resource-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev244-imprimitive-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Run resource and inherited imprimitive regressions
        run: >-
          python -m pytest -q
          test_imprimitive_quotient_kernel_resource_rev244.py
          test_candidate_transitive_imprimitive_rev172.py
          test_v2_imprimitive_small_image_v1.py
      - name: Compile rev244 modules
        run: >-
          python -m py_compile
          imprimitive_quotient_kernel_resource_v1.py
          resource_bounded_imprimitive_candidate_si_v1.py
          u2_candidate_coset_string_iso_v8.py
          test_imprimitive_quotient_kernel_resource_rev244.py
