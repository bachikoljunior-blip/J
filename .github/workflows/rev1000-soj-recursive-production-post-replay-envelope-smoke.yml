name: rev1000 SOJ recursive production post-replay envelope smoke

on:
  push:
    branches:
      - agi-gi-rev1000-soj-recursive-production-post-replay-envelope-session-20260822-1451
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rev1000-soj-recursive-production-post-replay-envelope-smoke.yml'
      - 'automation_runs/2026-08-22_1451_JST/REV1000_SOJ_RECURSIVE_PRODUCTION_POST_REPLAY_ENVELOPE.md'
      - 'automation_runs/2026-08-22_1451_JST/soj_recursive_production_post_replay_envelope_v1.py'
      - 'automation_runs/2026-08-22_1451_JST/test_soj_recursive_production_post_replay_envelope_rev1000.py'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev1000-soj-recursive-production-post-replay-envelope-20260822T1451JST-0b1c7a15-attempt-solution.json'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev1000-soj-recursive-production-post-replay-envelope-20260822T1451JST-0b1c7a15-publish.json'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile rev1000 module and tests
        run: |
          python -m py_compile \
            automation_runs/2026-08-22_1451_JST/soj_recursive_production_post_replay_envelope_v1.py \
            automation_runs/2026-08-22_1451_JST/test_soj_recursive_production_post_replay_envelope_rev1000.py
      - name: Run rev1000 focused regressions
        run: python automation_runs/2026-08-22_1451_JST/test_soj_recursive_production_post_replay_envelope_rev1000.py
      - name: Reject branch-only sibling implementation imports
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'soj_recursive_production_cost_provenance_v1|soj_recursive_production_provenance_total_cost_binding_v1' \
            automation_runs/2026-08-22_1451_JST/soj_recursive_production_post_replay_envelope_v1.py
      - name: Canonical attempt_solution admission preview
        shell: bash
        run: |
          set -euo pipefail
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev1000-soj-recursive-production-post-replay-envelope-20260822T1451JST-0b1c7a15 \
            --phase attempt_solution \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-production-post-replay-coherence-envelope \
            --target-revision 1000 \
            --path .github/workflows/rev1000-soj-recursive-production-post-replay-envelope-smoke.yml \
            --path automation_runs/2026-08-22_1451_JST/REV1000_SOJ_RECURSIVE_PRODUCTION_POST_REPLAY_ENVELOPE.md \
            --path automation_runs/2026-08-22_1451_JST/soj_recursive_production_post_replay_envelope_v1.py \
            --path automation_runs/2026-08-22_1451_JST/test_soj_recursive_production_post_replay_envelope_rev1000.py \
            --output /tmp/rev1000-attempt.json
          test -s /tmp/rev1000-attempt.json
          cat /tmp/rev1000-attempt.json
      - name: Enforce reserved rev1000 diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only "$base" HEAD > /tmp/rev1000-changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/rev1000-soj-recursive-production-post-replay-envelope-smoke.yml',
              'automation_runs/2026-08-22_1451_JST/REV1000_SOJ_RECURSIVE_PRODUCTION_POST_REPLAY_ENVELOPE.md',
              'automation_runs/2026-08-22_1451_JST/soj_recursive_production_post_replay_envelope_v1.py',
              'automation_runs/2026-08-22_1451_JST/test_soj_recursive_production_post_replay_envelope_rev1000.py',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev1000-soj-recursive-production-post-replay-envelope-20260822T1451JST-0b1c7a15-attempt-solution.json',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev1000-soj-recursive-production-post-replay-envelope-20260822T1451JST-0b1c7a15-publish.json',
          }
          changed={line.strip() for line in Path('/tmp/rev1000-changed.txt').read_text().splitlines() if line.strip()}
          extra=sorted(changed-allowed)
          assert not extra, f'unreserved rev1000 paths changed: {extra}'
          expected={
              '.github/workflows/rev1000-soj-recursive-production-post-replay-envelope-smoke.yml',
              'automation_runs/2026-08-22_1451_JST/REV1000_SOJ_RECURSIVE_PRODUCTION_POST_REPLAY_ENVELOPE.md',
              'automation_runs/2026-08-22_1451_JST/soj_recursive_production_post_replay_envelope_v1.py',
              'automation_runs/2026-08-22_1451_JST/test_soj_recursive_production_post_replay_envelope_rev1000.py',
          }
          missing=sorted(expected-changed)
          assert not missing, f'missing expected rev1000 paths: {missing}'
          print('reserved-path diff ok:', sorted(changed))
          PY
      - name: Materialize canonical attempt_solution admission after green smoke
        if: github.event_name == 'push'
        shell: bash
        env:
          EVIDENCE: agi/run-history/phase-admissions/chatgpt-session-j-rev1000-soj-recursive-production-post-replay-envelope-20260822T1451JST-0b1c7a15-attempt-solution.json
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE" ]]; then
            echo 'canonical attempt_solution evidence already present; no branch mutation'
            exit 0
          fi
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev1000-soj-recursive-production-post-replay-envelope-20260822T1451JST-0b1c7a15 \
            --phase attempt_solution \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-production-post-replay-coherence-envelope \
            --target-revision 1000 \
            --path .github/workflows/rev1000-soj-recursive-production-post-replay-envelope-smoke.yml \
            --path automation_runs/2026-08-22_1451_JST/REV1000_SOJ_RECURSIVE_PRODUCTION_POST_REPLAY_ENVELOPE.md \
            --path automation_runs/2026-08-22_1451_JST/soj_recursive_production_post_replay_envelope_v1.py \
            --path automation_runs/2026-08-22_1451_JST/test_soj_recursive_production_post_replay_envelope_rev1000.py \
            --output "$EVIDENCE"
          test -s "$EVIDENCE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVIDENCE"
          git commit -m 'coordination: add rev1000 attempt-solution admission evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
