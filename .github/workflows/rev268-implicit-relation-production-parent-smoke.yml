              "import implicit_relation_parent_exact_empty_v1",
              "import implicit_relation_image_resource_envelope_v2",
              "import implicit_relation_parent_outcome_v1",
          )
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit(f"branch-only sibling imports are forbidden in rev268: {hits}")
          print("PASS: rev268 remains a structural orchestration boundary")
          PY
