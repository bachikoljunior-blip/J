name: rev256 bounded relation-image coset smoke

on:
  pull_request:
    paths:
      - "automation_runs/2026-08-19_0851_JST/bounded_relation_image_coset_v1.py"
      - "automation_runs/2026-08-19_0851_JST/test_bounded_relation_image_coset_rev256.py"
      - ".github/workflows/rev256-bounded-relation-image-coset-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q automation_runs/2026-08-19_0851_JST/test_bounded_relation_image_coset_rev256.py
      - run: python -m py_compile automation_runs/2026-08-19_0851_JST/bounded_relation_image_coset_v1.py automation_runs/2026-08-19_0851_JST/test_bounded_relation_image_coset_rev256.py
