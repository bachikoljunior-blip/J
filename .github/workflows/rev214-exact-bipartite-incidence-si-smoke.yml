name: rev214 exact bipartite incidence si smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/bipartite_uniform_neighborhood_string_iso_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_bipartite_uniform_neighborhood_string_iso_rev214.py'
      - '.github/workflows/rev214-exact-bipartite-incidence-si-smoke.yml'

permissions:
  contents: read

jobs:
  rev214-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: python -m pytest -q test_bipartite_uniform_neighborhood_string_iso_rev214.py
