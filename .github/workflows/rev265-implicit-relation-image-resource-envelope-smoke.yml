name: rev265 implicit relation-image resource envelope smoke

on:
  pull_request:
    paths:
      - '.github/workflows/rev265-implicit-relation-image-resource-envelope-smoke.yml'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev265-resource-envelope-20260822T074900JST-f3389aa0-attempt-solution.json'
      - 'automation_runs/2026-08-19_0851_JST/REV265_IMPLICIT_RELATION_IMAGE_RESOURCE_ENVELOPE.md'
      - 'automation_runs/2026-08-19_0851_JST/implicit_relation_image_resource_envelope_v2.py'
      - 'automation_runs/2026-08-19_0851_JST/test_implicit_relation_image_resource_envelope_rev265.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run rev265 focused regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: python -m unittest -v test_implicit_relation_image_resource_envelope_rev265.py
      - name: Compile rev265 module and tests
        run: >-
          python -m py_compile
          automation_runs/2026-08-19_0851_JST/implicit_relation_image_resource_envelope_v2.py
          automation_runs/2026-08-19_0851_JST/test_implicit_relation_image_resource_envelope_rev265.py
