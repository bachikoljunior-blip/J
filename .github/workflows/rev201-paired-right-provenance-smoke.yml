name: rev201 paired right-partition provenance smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/paired_bipartite_right_partition_provenance_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_paired_bipartite_right_partition_provenance_rev201.py'
      - 'automation_runs/2026-08-19_0851_JST/PAIRED_RIGHT_PARTITION_PROVENANCE_AUDIT_REV201.md'
      - 'automation_runs/2026-08-19_0851_JST/CURRENT_STATUS_REV0201.json'
      - '.github/workflows/rev201-paired-right-provenance-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev201:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate paired right partition provenance
        run: python -m pytest -q test_paired_bipartite_right_partition_provenance_rev201.py
