name: AGI eval v1 integrity

on:
  push:
    paths:
      - 'agi/eval/v1/**'
      - '.github/workflows/agi-eval-v1.yml'
  pull_request:
    paths:
      - 'agi/eval/v1/**'
      - '.github/workflows/agi-eval-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r agi/eval/v1/requirements.txt pytest
      - name: Unit and development-pipeline tests
        working-directory: agi/eval/v1
        run: python -m pytest -q
      - name: Build isolated candidate fixture
        working-directory: agi/eval/v1
        run: docker build -t agi-eval-v1-ci-fixture -f ci_fixture/Dockerfile ci_fixture
      - name: Exercise final container path
        working-directory: agi/eval/v1
        run: python ci_container_integration.py
      - name: Build broker/provider isolation fixtures
        working-directory: agi/eval/v1
        run: |
          docker build -t agi-eval-v1-ci-broker-candidate -f ci_fixture/Dockerfile.broker ci_fixture
          docker build -t agi-eval-v1-ci-provider -f ci_fixture/Dockerfile.provider ci_fixture
          docker build -t agi-eval-v1-ci-service -f ci_fixture/Dockerfile.service ci_fixture
      - name: Exercise final broker/provider isolation path
        working-directory: agi/eval/v1
        run: python ci_broker_provider_integration.py
      - name: Build sealed-bank qualification fixtures
        working-directory: agi/eval/v1
        run: |
          docker build --build-arg LINEAGE=alpha -t agi-eval-v1-ci-sealed-alpha -f ci_fixture/Dockerfile.sealed_bank ci_fixture
          docker build --build-arg LINEAGE=beta -t agi-eval-v1-ci-sealed-beta -f ci_fixture/Dockerfile.sealed_bank ci_fixture
      - name: Exercise sealed-bank freeze and qualification path
        working-directory: agi/eval/v1
        run: python ci_sealed_bank_integration.py
