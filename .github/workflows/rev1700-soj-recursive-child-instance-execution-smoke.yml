name: rev1700 SOJ recursive child-instance execution smoke

on:
  push:
    branches:
      - agi-gi-rev1700-soj-recursive-child-instance-execution-session-20260822-1650
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rev1700-soj-recursive-child-instance-execution-smoke.yml'
      - 'automation_runs/2026-08-22_1650_JST/REV1700_SOJ_RECURSIVE_CHILD_INSTANCE_EXECUTION.md'
      - 'automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py'
      - 'automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4-attempt-solution.json'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4-publish.json'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: automation_runs/2026-08-19_0851_JST:automation_runs/2026-08-22_1650_JST
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inherited S1 runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile rev1700 module and tests
        run: |
          python -m py_compile \
            automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py \
            automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py
      - name: Run rev1700 focused regressions
        run: python automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py
      - name: Reject sibling branch-only implementation imports
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'corrected_soj_johnson_relational_reduction_v1|corrected_soj_johnson_recursive_result_lift_v1|soj_recursive_production_execution_proof_dag_v1|soj_recursive_production_lineage_closure_v1' \
            automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py
      - name: Canonical attempt_solution admission preview
        shell: bash
        run: |
          set -euo pipefail
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4 \
            --phase attempt_solution \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-child-instance-execution-binding \
            --target-revision 1700 \
            --path .github/workflows/rev1700-soj-recursive-child-instance-execution-smoke.yml \
            --path automation_runs/2026-08-22_1650_JST/REV1700_SOJ_RECURSIVE_CHILD_INSTANCE_EXECUTION.md \
            --path automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py \
            --path automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py \
            --output /tmp/rev1700-attempt.json
          test -s /tmp/rev1700-attempt.json
          cat /tmp/rev1700-attempt.json
      - name: Canonical publish admission preview
        shell: bash
        run: |
          set -euo pipefail
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4 \
            --phase publish \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-child-instance-execution-binding \
            --target-revision 1700 \
            --path .github/workflows/rev1700-soj-recursive-child-instance-execution-smoke.yml \
            --path automation_runs/2026-08-22_1650_JST/REV1700_SOJ_RECURSIVE_CHILD_INSTANCE_EXECUTION.md \
            --path automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py \
            --path automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py \
            --output /tmp/rev1700-publish.json
          test -s /tmp/rev1700-publish.json
          cat /tmp/rev1700-publish.json
      - name: Enforce reserved rev1700 diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only "$base" HEAD > /tmp/rev1700-changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/rev1700-soj-recursive-child-instance-execution-smoke.yml',
              'automation_runs/2026-08-22_1650_JST/REV1700_SOJ_RECURSIVE_CHILD_INSTANCE_EXECUTION.md',
              'automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py',
              'automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4-attempt-solution.json',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4-publish.json',
          }
          expected = {
              '.github/workflows/rev1700-soj-recursive-child-instance-execution-smoke.yml',
              'automation_runs/2026-08-22_1650_JST/REV1700_SOJ_RECURSIVE_CHILD_INSTANCE_EXECUTION.md',
              'automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py',
              'automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py',
          }
          changed = {line.strip() for line in Path('/tmp/rev1700-changed.txt').read_text().splitlines() if line.strip()}
          extra = sorted(changed - allowed)
          missing = sorted(expected - changed)
          assert not extra, f'unreserved rev1700 paths changed: {extra}'
          assert not missing, f'missing expected rev1700 paths: {missing}'
          print('reserved-path diff ok:', sorted(changed))
          PY
      - name: Materialize canonical attempt_solution admission after green smoke
        if: github.event_name == 'push'
        shell: bash
        env:
          EVIDENCE: agi/run-history/phase-admissions/chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4-attempt-solution.json
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE" ]]; then
            echo 'canonical attempt_solution evidence already present; no branch mutation'
          else
            python automation/problem_solving_parallel_admission.py \
              --claim-id chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4 \
              --phase attempt_solution \
              --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-child-instance-execution-binding \
              --target-revision 1700 \
              --path .github/workflows/rev1700-soj-recursive-child-instance-execution-smoke.yml \
              --path automation_runs/2026-08-22_1650_JST/REV1700_SOJ_RECURSIVE_CHILD_INSTANCE_EXECUTION.md \
              --path automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py \
              --path automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py \
              --output "$EVIDENCE"
            test -s "$EVIDENCE"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$EVIDENCE"
            git commit -m 'coordination: add rev1700 attempt-solution admission evidence'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Materialize canonical publish admission after green smoke
        if: github.event_name == 'push'
        shell: bash
        env:
          EVIDENCE: agi/run-history/phase-admissions/chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4-publish.json
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE" ]]; then
            echo 'canonical publish evidence already present; no branch mutation'
            exit 0
          fi
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev1700-soj-recursive-child-instance-execution-20260822T165000JST-2d91c7e4 \
            --phase publish \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-child-instance-execution-binding \
            --target-revision 1700 \
            --path .github/workflows/rev1700-soj-recursive-child-instance-execution-smoke.yml \
            --path automation_runs/2026-08-22_1650_JST/REV1700_SOJ_RECURSIVE_CHILD_INSTANCE_EXECUTION.md \
            --path automation_runs/2026-08-22_1650_JST/soj_recursive_child_instance_execution_v1.py \
            --path automation_runs/2026-08-22_1650_JST/test_soj_recursive_child_instance_execution_rev1700.py \
            --output "$EVIDENCE"
          test -s "$EVIDENCE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVIDENCE"
          git commit -m 'coordination: add rev1700 publish admission evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
