name: Problem-solving parallel admission

on:
  pull_request:
    paths:
      - MAIN.md
      - agi/**
      - automation/**
      - automation_runs/**
      - .github/workflows/agi-gi*.yml
      - .github/workflows/rev*.yml
      - .github/workflows/problem-solving-parallel-admission.yml
  push:
    branches:
      - main
    paths:
      - MAIN.md
      - agi/**
      - automation/**
      - automation_runs/**
      - .github/workflows/agi-gi*.yml
      - .github/workflows/rev*.yml
      - .github/workflows/problem-solving-parallel-admission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select commit-local changes and current registry
        run: |
          git fetch --no-tags origin main
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$(git merge-base origin/main HEAD)"
            current_registry_ref="origin/main"
          else
            base="$(git rev-parse HEAD^)"
            current_registry_ref="$base"
          fi
          git diff --name-only "$base" HEAD > /tmp/changed-files.txt
          echo "CURRENT_REGISTRY_REF=$current_registry_ref" >> "$GITHUB_ENV"
      - name: Replay phase-admission evidence
        run: |
          python automation/problem_solving_phase_evidence_guard.py \
            --changed-files /tmp/changed-files.txt \
            --head-ref HEAD \
            --current-registry-ref "$CURRENT_REGISTRY_REF"
