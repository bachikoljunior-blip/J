name: rev620 small-order production proof-DAG smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/small_order_production_proof_dag_consumer_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_small_order_production_proof_dag_consumer_rev620.py'
      - 'automation_runs/2026-08-19_0851_JST/REV620_SMALL_ORDER_PRODUCTION_PROOF_DAG.md'
      - '.github/workflows/rev620-small-order-proof-dag-smoke.yml'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev620-small-order-proof-dag-20260822T1349JST-f3bc7ed4-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical attempt-solution admission snapshot
        run: |
          rm -rf /tmp/rev620-main-attempt
          git worktree add --detach /tmp/rev620-main-attempt 16c8d0a55b81bee5fb2b14eb3b5c0bb94de08950
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev620-main-attempt \
            --claim-id chatgpt-session-j-rev620-small-order-proof-dag-20260822T1349JST-f3bc7ed4 \
            --phase attempt_solution \
            --scope crx3/algorithmic-consumers/proof-carrying-small-order-production-proof-dag \
            --target-revision 620 \
            --path .github/workflows/rev620-small-order-proof-dag-smoke.yml \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev620-small-order-proof-dag-20260822T1349JST-f3bc7ed4-attempt-solution.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev620-small-order-proof-dag-20260822T1349JST-f3bc7ed4-publish.json \
            --path automation_runs/2026-08-19_0851_JST/REV620_SMALL_ORDER_PRODUCTION_PROOF_DAG.md \
            --path automation_runs/2026-08-19_0851_JST/small_order_production_proof_dag_consumer_v1.py \
            --path automation_runs/2026-08-19_0851_JST/test_small_order_production_proof_dag_consumer_rev620.py \
            --output /tmp/rev620-attempt-solution.json
          cat /tmp/rev620-attempt-solution.json
      - name: Preserve generated attempt evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev620-attempt-solution-evidence
          path: /tmp/rev620-attempt-solution.json
          if-no-files-found: error
          retention-days: 1
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Compile rev620 consumer and tests
        run: |
          cd automation_runs/2026-08-19_0851_JST
          python -m py_compile small_order_production_proof_dag_consumer_v1.py test_small_order_production_proof_dag_consumer_rev620.py
      - name: Run rev252, rev220/rev289, and focused rev620 tests
        run: |
          cd automation_runs/2026-08-19_0851_JST
          python -m pytest -q \
            test_proof_carrying_small_order_production_admission_rev252.py \
            test_proof_dag_accounting_rev220.py \
            test_proof_dag_envelope_input_validation_rev289.py \
            test_small_order_production_proof_dag_consumer_rev620.py
      - name: Reject sibling branch-only dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('automation_runs/2026-08-19_0851_JST/small_order_production_proof_dag_consumer_v1.py').read_text()
          forbidden = (
              'corrected_soj',
              'primitive_johnson_proof_dag_consumer_v1',
              'literal_giant',
              'parent_outcome_proof_dag',
              'homogeneous_block_action_kernel_v1',
              'signed_johnson_ground_proof_dag_consumer_v1',
          )
          hits = [name for name in forbidden if name in text]
          if hits:
              raise SystemExit(f'branch-only/sibling dependency detected: {hits}')
          PY
      - name: Generate canonical publish admission snapshot
        run: |
          rm -rf /tmp/rev620-main-publish
          git worktree add --detach /tmp/rev620-main-publish 16c8d0a55b81bee5fb2b14eb3b5c0bb94de08950
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev620-main-publish \
            --claim-id chatgpt-session-j-rev620-small-order-proof-dag-20260822T1349JST-f3bc7ed4 \
            --phase publish \
            --scope crx3/algorithmic-consumers/proof-carrying-small-order-production-proof-dag \
            --target-revision 620 \
            --path .github/workflows/rev620-small-order-proof-dag-smoke.yml \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev620-small-order-proof-dag-20260822T1349JST-f3bc7ed4-attempt-solution.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev620-small-order-proof-dag-20260822T1349JST-f3bc7ed4-publish.json \
            --path automation_runs/2026-08-19_0851_JST/REV620_SMALL_ORDER_PRODUCTION_PROOF_DAG.md \
            --path automation_runs/2026-08-19_0851_JST/small_order_production_proof_dag_consumer_v1.py \
            --path automation_runs/2026-08-19_0851_JST/test_small_order_production_proof_dag_consumer_rev620.py \
            --output /tmp/rev620-publish.json
          cat /tmp/rev620-publish.json
      - name: Preserve generated publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev620-publish-evidence
          path: /tmp/rev620-publish.json
          if-no-files-found: error
          retention-days: 1
