name: rev2300 homogeneous block structural original-domain coherence smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "agi-gi-rev2300-homogeneous-block-structural-quotient-coherence-session-20260822-1750"
    paths:
      - "automation_runs/2026-08-22_1750_JST/homogeneous_block_structural_quotient_coherence_v1.py"
      - "automation_runs/2026-08-22_1750_JST/test_homogeneous_block_structural_quotient_coherence_rev2300.py"
      - "automation_runs/2026-08-22_1750_JST/REV2300_HOMOGENEOUS_BLOCK_STRUCTURAL_QUOTIENT_COHERENCE.md"
      - ".github/workflows/rev2300-homogeneous-block-structural-quotient-coherence-smoke.yml"
  pull_request:
    paths:
      - "automation_runs/2026-08-22_1750_JST/homogeneous_block_structural_quotient_coherence_v1.py"
      - "automation_runs/2026-08-22_1750_JST/test_homogeneous_block_structural_quotient_coherence_rev2300.py"
      - "automation_runs/2026-08-22_1750_JST/REV2300_HOMOGENEOUS_BLOCK_STRUCTURAL_QUOTIENT_COHERENCE.md"
      - ".github/workflows/rev2300-homogeneous-block-structural-quotient-coherence-smoke.yml"

permissions:
  contents: write

concurrency:
  group: rev2300-homogeneous-block-structural-original-domain-coherence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rev2300-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate canonical attempt-solution and publish admission previews
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          attempt="${RUNNER_TEMP}/rev2300-attempt-solution.json"
          publish="${RUNNER_TEMP}/rev2300-publish.json"
          common=(
            --claim-id chatgpt-session-j-rev2300-homogeneous-block-structural-quotient-coherence-20260822T175000JST-5ee6ec94
            --scope crx3/algorithmic-consumers/homogeneous-block-structural-original-domain-proof-coherence
            --target-revision 2300
            --path .github/workflows/rev2300-homogeneous-block-structural-quotient-coherence-smoke.yml
            --path automation_runs/2026-08-22_1750_JST/REV2300_HOMOGENEOUS_BLOCK_STRUCTURAL_QUOTIENT_COHERENCE.md
            --path automation_runs/2026-08-22_1750_JST/homogeneous_block_structural_quotient_coherence_v1.py
            --path automation_runs/2026-08-22_1750_JST/test_homogeneous_block_structural_quotient_coherence_rev2300.py
          )
          python automation/problem_solving_parallel_admission.py \
            "${common[@]}" --phase attempt_solution \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev2300-homogeneous-block-structural-quotient-coherence-20260822T175000JST-5ee6ec94-attempt_solution.json \
            --output "${attempt}"
          python automation/problem_solving_parallel_admission.py \
            "${common[@]}" --phase publish \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev2300-homogeneous-block-structural-quotient-coherence-20260822T175000JST-5ee6ec94-publish.json \
            --output "${publish}"
          jq -e '.admitted == true and .conflicts == []' "${attempt}"
          jq -e '.admitted == true and .conflicts == []' "${publish}"
          echo "attempt=${attempt}" >>"${GITHUB_OUTPUT}"
          echo "publish=${publish}" >>"${GITHUB_OUTPUT}"

      - name: Run focused rev2300 regressions
        run: python automation_runs/2026-08-22_1750_JST/test_homogeneous_block_structural_quotient_coherence_rev2300.py

      - name: Compile rev2300 implementation and tests
        run: >-
          python -m py_compile
          automation_runs/2026-08-22_1750_JST/homogeneous_block_structural_quotient_coherence_v1.py
          automation_runs/2026-08-22_1750_JST/test_homogeneous_block_structural_quotient_coherence_rev2300.py

      - name: Enforce branch-only dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          file="automation_runs/2026-08-22_1750_JST/homogeneous_block_structural_quotient_coherence_v1.py"
          ! grep -Eq '^(from|import) .*homogeneous_block_joint_compatibility_proof_dag_v1' "${file}"
          ! grep -Eq '^(from|import) .*homogeneous_block_quotient_original_domain_proof_dag_rev2100' "${file}"
          ! grep -Eq '^(from|import) .*homogeneous_block_quotient_si_proof_dag_consumer_v1' "${file}"
          ! grep -Eq '^(from|import) .*block_action_preimage_coset_v1' "${file}"

      - name: Enforce reserved diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only "${base}"..HEAD | sort >"${RUNNER_TEMP}/actual"
          cat >"${RUNNER_TEMP}/allowed" <<'EOF'
          .github/workflows/rev2300-homogeneous-block-structural-quotient-coherence-smoke.yml
          agi/run-history/phase-admissions/chatgpt-session-j-rev2300-homogeneous-block-structural-quotient-coherence-20260822T175000JST-5ee6ec94-attempt_solution.json
          agi/run-history/phase-admissions/chatgpt-session-j-rev2300-homogeneous-block-structural-quotient-coherence-20260822T175000JST-5ee6ec94-publish.json
          automation_runs/2026-08-22_1750_JST/REV2300_HOMOGENEOUS_BLOCK_STRUCTURAL_QUOTIENT_COHERENCE.md
          automation_runs/2026-08-22_1750_JST/homogeneous_block_structural_quotient_coherence_v1.py
          automation_runs/2026-08-22_1750_JST/test_homogeneous_block_structural_quotient_coherence_rev2300.py
          EOF
          sort -o "${RUNNER_TEMP}/allowed" "${RUNNER_TEMP}/allowed"
          if comm -23 "${RUNNER_TEMP}/actual" "${RUNNER_TEMP}/allowed" | grep -q .; then
            echo "rev2300 branch changed a non-reserved path" >&2
            comm -23 "${RUNNER_TEMP}/actual" "${RUNNER_TEMP}/allowed" >&2
            exit 1
          fi

      - name: Persist canonical attempt-solution and publish admission on this branch
        if: github.event_name == 'push'
        shell: bash
        env:
          ATTEMPT_PREVIEW: ${{ steps.admission.outputs.attempt }}
          PUBLISH_PREVIEW: ${{ steps.admission.outputs.publish }}
        run: |
          set -euo pipefail
          attempt="agi/run-history/phase-admissions/chatgpt-session-j-rev2300-homogeneous-block-structural-quotient-coherence-20260822T175000JST-5ee6ec94-attempt_solution.json"
          publish="agi/run-history/phase-admissions/chatgpt-session-j-rev2300-homogeneous-block-structural-quotient-coherence-20260822T175000JST-5ee6ec94-publish.json"
          mkdir -p "$(dirname "${attempt}")"
          cp "${ATTEMPT_PREVIEW}" "${attempt}"
          cp "${PUBLISH_PREVIEW}" "${publish}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${attempt}" "${publish}"
          if ! git diff --cached --quiet; then
            git commit -m "coordination: persist rev2300 attempt and publish admission"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
