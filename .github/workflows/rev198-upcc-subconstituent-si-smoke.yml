name: rev198 UPCC subconstituent SI smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/upcc_subconstituent_full_string_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_upcc_subconstituent_full_string_si_rev198.py'
      - '.github/workflows/rev198-upcc-subconstituent-si-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev198:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate exact UPCC subconstituent full-string path
        run: python -m pytest -q test_upcc_subconstituent_full_string_si_rev198.py
