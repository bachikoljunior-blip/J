name: rev191 H6 log Design smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/signed_johnson_log_design_lemma_si_v2.py'
      - 'automation_runs/2026-08-19_0851_JST/test_signed_johnson_log_design_lemma_rev191.py'
      - '.github/workflows/rev191-h6-log-design-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev191:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate H5-to-H6 logarithmic Design connection
        run: python -m pytest -q test_signed_johnson_log_design_lemma_rev191.py
