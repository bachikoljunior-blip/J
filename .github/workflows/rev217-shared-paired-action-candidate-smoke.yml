name: rev217 shared paired action candidate smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/paired_action_full_candidate_filter_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/signed_johnson_complement_safe_image_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/signed_johnson_relation_image_candidate_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/signed_johnson_joint_relation_candidate_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/signed_johnson_log_codegree_image_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_shared_paired_action_candidate_artifact_rev217.py'
      - '.github/workflows/rev217-shared-paired-action-candidate-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev217-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_shared_paired_action_candidate_artifact_rev217.py
          test_shared_log_relation_artifact_rev216.py
          test_general_log_pair_image_rev214.py
          test_signed_johnson_log_codegree_image_rev211.py
          test_signed_johnson_joint_relation_candidate_si_rev183.py
          test_signed_johnson_relation_image_candidate_si_rev181.py
          test_signed_johnson_complement_safe_image_si_rev180.py
