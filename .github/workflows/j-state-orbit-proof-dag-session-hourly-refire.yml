name: J state-orbit proof-DAG session hourly re-fire

on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/j-state-orbit-proof-dag-session-hourly-refire.yml"
      - "agi/run-history/active/chatgpt-session-j-crx3-state-orbit-proof-dag-20260822T065011JST-89c598e1.json"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: j-state-orbit-proof-dag-session-hourly-refire-runtime
  cancel-in-progress: false

jobs:
  re-fire-stale-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect stale state-orbit proof-DAG session activity
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_PATH: agi/run-history/active/chatgpt-session-j-crx3-state-orbit-proof-dag-20260822T065011JST-89c598e1.json
          BRANCH: agi-gi-state-orbit-proof-dag-session-20260822-0650-89c598e1
          STALE_AFTER_MINUTES: "55"
        run: |
          set -euo pipefail

          now_epoch="$(date -u +%s)"
          cutoff_epoch="$((now_epoch - STALE_AFTER_MINUTES * 60))"

          claim_json="$({
            gh api "repos/${REPOSITORY}/contents/${CLAIM_PATH}?ref=main" \
              --jq '.content' | tr -d '\n' | base64 --decode
          } 2>/dev/null)" || {
            echo "stale=false" >>"${GITHUB_OUTPUT}"
            echo "reason=exact claim read failed; fail closed without emitting a request" >>"${GITHUB_OUTPUT}"
            exit 0
          }
          claim_status="$(jq -r '.status' <<<"${claim_json}")"
          heartbeat="$(jq -r '.heartbeat_at_jst // .started_at_jst' <<<"${claim_json}")"
          heartbeat_epoch="$(date -d "${heartbeat}" +%s)"

          branch_epoch=0
          if branch_date="$(
            gh api "repos/${REPOSITORY}/commits/${BRANCH}" \
              --jq '.commit.committer.date // .commit.author.date' 2>/dev/null
          )"; then
            branch_epoch="$(date -d "${branch_date}" +%s)"
          fi

          owner="${REPOSITORY%%/*}"
          pr_epoch=0
          pr_updated="$(
            gh api "repos/${REPOSITORY}/pulls?state=open&head=${owner}:${BRANCH}&per_page=1" \
              --jq '.[0].updated_at // empty'
          )"
          if [[ -n "${pr_updated}" ]]; then
            pr_epoch="$(date -d "${pr_updated}" +%s)"
          fi

          latest_epoch="${heartbeat_epoch}"
          (( branch_epoch > latest_epoch )) && latest_epoch="${branch_epoch}"
          (( pr_epoch > latest_epoch )) && latest_epoch="${pr_epoch}"

          stale=false
          reason="session activity is fresh"
          if [[ "${claim_status}" != "active" ]]; then
            reason="claim is ${claim_status}; no re-fire is needed"
          elif (( latest_epoch < cutoff_epoch )); then
            stale=true
            reason="no exact-session heartbeat, branch commit, or PR update was seen within ${STALE_AFTER_MINUTES} minutes"
          fi

          echo "stale=${stale}" >>"${GITHUB_OUTPUT}"
          echo "reason=${reason}" >>"${GITHUB_OUTPUT}"
          {
            echo "### J state-orbit proof-DAG session guard"
            echo "- Claim status: ${claim_status}"
            echo "- Claim heartbeat: ${heartbeat}"
            echo "- Branch activity epoch: ${branch_epoch}"
            echo "- PR activity epoch: ${pr_epoch}"
            echo "- Decision: ${reason}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Emit durable continuation request
        if: github.event_name != 'pull_request' && steps.guard.outputs.stale == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAIM_PATH: agi/run-history/active/chatgpt-session-j-crx3-state-orbit-proof-dag-20260822T065011JST-89c598e1.json
          BRANCH: agi-gi-state-orbit-proof-dag-session-20260822-0650-89c598e1
        run: |
          set -euo pipefail

          title="[automation] J state-orbit proof-DAG session re-fire queue"
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          issue_number="$(
            gh issue list --repo "${REPOSITORY}" --state open --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n 1
          )"

          message="Hourly continuation requested at ${timestamp}. Reconstruct scope crx3/algorithmic-consumers/state-orbit-exact-terminal-proof-dag from ${CLAIM_PATH} and branch ${BRANCH}. Recheck agi/run-history/active before every write and preserve every sibling claim, branch, PR, issue, and workflow. Trigger: ${RUN_URL}"

          if [[ -z "${issue_number}" ]]; then
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${message}"
          else
            gh issue comment "${issue_number}" --repo "${REPOSITORY}" --body "${message}"
          fi
