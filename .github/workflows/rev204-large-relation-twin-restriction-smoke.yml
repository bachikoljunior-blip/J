name: rev204 large relation twin restriction smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/paired_bipartite_large_relation_twin_restriction_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_paired_bipartite_large_relation_twin_restriction_rev204.py'
      - 'automation_runs/2026-08-19_0851_JST/LARGE_RELATION_TWIN_RESTRICTION_AUDIT_REV204.md'
      - 'automation_runs/2026-08-19_0851_JST/CURRENT_STATUS_REV0204.json'
      - '.github/workflows/rev204-large-relation-twin-restriction-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rev204:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate large relation twin restriction
        run: python -m pytest -q test_paired_bipartite_large_relation_twin_restriction_rev204.py
