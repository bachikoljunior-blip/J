name: rev232 correlated t-WL resource smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/correlated_twl_resource_envelope_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/design_lemma_exact_twl_candidate_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/local_certificate_exact_twl_design_si_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_correlated_twl_resource_rev232.py'
      - '.github/workflows/rev232-correlated-twl-resource-smoke.yml'
      - '.github/workflows/agi-gi-rev-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rev232-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest numpy
      - run: >-
          python -m pytest -q
          test_correlated_twl_resource_rev232.py
          test_design_lemma_exact_twl_candidate_rev194.py
          test_local_certificate_exact_twl_design_rev221.py
          test_relation_aggregation_resource_rev231.py
          test_paired_theorem_local_certificate_rev230.py
