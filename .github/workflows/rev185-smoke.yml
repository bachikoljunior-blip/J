name: rev185 symmetry defect smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/colored_subset_symmetry_defect_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_colored_subset_symmetry_defect_rev185.py'
      - '.github/workflows/rev185-smoke.yml'

permissions:
  contents: read

jobs:
  rev185-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q test_colored_subset_symmetry_defect_rev185.py
