name: rev800 SOJ recursive production total cost coherence smoke

on:
  push:
    branches:
      - agi-gi-rev800-soj-recursive-production-total-cost-coherence-session-20260822-1411
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rev800-soj-recursive-production-total-cost-coherence-smoke.yml'
      - 'automation_runs/2026-08-22_1411_JST/REV800_SOJ_RECURSIVE_PRODUCTION_TOTAL_COST_COHERENCE.md'
      - 'automation_runs/2026-08-22_1411_JST/soj_recursive_production_total_cost_coherence_v1.py'
      - 'automation_runs/2026-08-22_1411_JST/test_soj_recursive_production_total_cost_coherence_rev800.py'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev800-soj-recursive-production-total-cost-coherence-20260822T141100JST-8b2e4c61-attempt-solution.json'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev800-soj-recursive-production-total-cost-coherence-20260822T141100JST-8b2e4c61-publish.json'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile rev800 module and tests
        run: |
          python -m py_compile \
            automation_runs/2026-08-22_1411_JST/soj_recursive_production_total_cost_coherence_v1.py \
            automation_runs/2026-08-22_1411_JST/test_soj_recursive_production_total_cost_coherence_rev800.py
      - name: Run rev800 focused regressions
        run: python automation_runs/2026-08-22_1411_JST/test_soj_recursive_production_total_cost_coherence_rev800.py
      - name: Reject branch-only sibling implementation imports
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'corrected_soj_johnson_recursive_result_accounting_binding_v1|corrected_soj_johnson_construction_cost_binding_v1' \
            automation_runs/2026-08-22_1411_JST/soj_recursive_production_total_cost_coherence_v1.py
      - name: Canonical attempt_solution admission preview
        shell: bash
        run: |
          set -euo pipefail
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev800-soj-recursive-production-total-cost-coherence-20260822T141100JST-8b2e4c61 \
            --phase attempt_solution \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-production-total-cost-coherence \
            --target-revision 800 \
            --path .github/workflows/rev800-soj-recursive-production-total-cost-coherence-smoke.yml \
            --path automation_runs/2026-08-22_1411_JST/REV800_SOJ_RECURSIVE_PRODUCTION_TOTAL_COST_COHERENCE.md \
            --path automation_runs/2026-08-22_1411_JST/soj_recursive_production_total_cost_coherence_v1.py \
            --path automation_runs/2026-08-22_1411_JST/test_soj_recursive_production_total_cost_coherence_rev800.py \
            --output /tmp/rev800-attempt.json
          test -s /tmp/rev800-attempt.json
          cat /tmp/rev800-attempt.json
      - name: Enforce reserved rev800 diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only "$base" HEAD > /tmp/rev800-changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/rev800-soj-recursive-production-total-cost-coherence-smoke.yml',
              'automation_runs/2026-08-22_1411_JST/REV800_SOJ_RECURSIVE_PRODUCTION_TOTAL_COST_COHERENCE.md',
              'automation_runs/2026-08-22_1411_JST/soj_recursive_production_total_cost_coherence_v1.py',
              'automation_runs/2026-08-22_1411_JST/test_soj_recursive_production_total_cost_coherence_rev800.py',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev800-soj-recursive-production-total-cost-coherence-20260822T141100JST-8b2e4c61-attempt-solution.json',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev800-soj-recursive-production-total-cost-coherence-20260822T141100JST-8b2e4c61-publish.json',
          }
          changed={line.strip() for line in Path('/tmp/rev800-changed.txt').read_text().splitlines() if line.strip()}
          extra=sorted(changed-allowed)
          assert not extra, f'unreserved rev800 paths changed: {extra}'
          expected={
              '.github/workflows/rev800-soj-recursive-production-total-cost-coherence-smoke.yml',
              'automation_runs/2026-08-22_1411_JST/REV800_SOJ_RECURSIVE_PRODUCTION_TOTAL_COST_COHERENCE.md',
              'automation_runs/2026-08-22_1411_JST/soj_recursive_production_total_cost_coherence_v1.py',
              'automation_runs/2026-08-22_1411_JST/test_soj_recursive_production_total_cost_coherence_rev800.py',
          }
          missing=sorted(expected-changed)
          assert not missing, f'missing expected rev800 paths: {missing}'
          print('reserved-path diff ok:', sorted(changed))
          PY
      - name: Materialize canonical attempt_solution admission after green smoke
        if: github.event_name == 'push'
        shell: bash
        env:
          EVIDENCE: agi/run-history/phase-admissions/chatgpt-session-j-rev800-soj-recursive-production-total-cost-coherence-20260822T141100JST-8b2e4c61-attempt-solution.json
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE" ]]; then
            echo 'canonical attempt_solution evidence already present; no branch mutation'
            exit 0
          fi
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev800-soj-recursive-production-total-cost-coherence-20260822T141100JST-8b2e4c61 \
            --phase attempt_solution \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-production-total-cost-coherence \
            --target-revision 800 \
            --path .github/workflows/rev800-soj-recursive-production-total-cost-coherence-smoke.yml \
            --path automation_runs/2026-08-22_1411_JST/REV800_SOJ_RECURSIVE_PRODUCTION_TOTAL_COST_COHERENCE.md \
            --path automation_runs/2026-08-22_1411_JST/soj_recursive_production_total_cost_coherence_v1.py \
            --path automation_runs/2026-08-22_1411_JST/test_soj_recursive_production_total_cost_coherence_rev800.py \
            --output "$EVIDENCE"
          test -s "$EVIDENCE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVIDENCE"
          git commit -m 'coordination: add rev800 attempt-solution admission evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
