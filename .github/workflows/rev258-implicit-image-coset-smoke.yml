name: rev258 implicit image value-coset smoke

on:
  pull_request:
    paths:
      - automation_runs/2026-08-19_0851_JST/implicit_relation_image_action_v1.py
      - automation_runs/2026-08-19_0851_JST/implicit_relation_image_coset_intersection_v1.py
      - automation_runs/2026-08-19_0851_JST/test_implicit_relation_image_coset_intersection_rev258.py
      - automation_runs/2026-08-19_0851_JST/REV258_IMPLICIT_IMAGE_COSET_INTERSECTION.md
      - .github/workflows/rev258-implicit-image-coset-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rev258 focused tests
        working-directory: automation_runs/2026-08-19_0851_JST
        run: python -m unittest -v test_implicit_relation_image_coset_intersection_rev258.py
      - name: Compile rev257/rev258 implementation
        run: python -m py_compile automation_runs/2026-08-19_0851_JST/implicit_relation_image_action_v1.py automation_runs/2026-08-19_0851_JST/implicit_relation_image_coset_intersection_v1.py
