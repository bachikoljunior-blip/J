name: rev241 Design union reconstruction resource smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  rev241-design-union-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - name: Run union and inherited complete-cover regressions
        working-directory: automation_runs/2026-08-19_0851_JST
        run: >-
          python -m pytest -q
          test_design_union_reconstruction_resource_rev241.py
          test_design_state_orbit_cover_rev240.py
          test_design_tuple_full_string_union_rev189.py
      - name: Compile changed modules
        run: >-
          python -m py_compile
          automation_runs/2026-08-19_0851_JST/design_union_reconstruction_resource_v1.py
          automation_runs/2026-08-19_0851_JST/design_tuple_full_string_union_si_v1.py
          automation_runs/2026-08-19_0851_JST/test_design_union_reconstruction_resource_rev241.py
