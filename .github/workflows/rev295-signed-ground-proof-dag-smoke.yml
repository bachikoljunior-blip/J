name: rev295 signed-ground proof-DAG smoke

on:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/signed_johnson_ground_proof_dag_consumer_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_signed_johnson_ground_proof_dag_consumer_rev295.py'
      - 'automation_runs/2026-08-19_0851_JST/REV295_SIGNED_GROUND_PROOF_DAG.md'
      - '.github/workflows/rev295-signed-ground-proof-dag-smoke.yml'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev295-signed-ground-proof-dag-20260822T1252JST-f3c4cedb-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical attempt-solution admission snapshot
        run: |
          git fetch --no-tags origin main
          rm -rf /tmp/rev295-main-attempt
          git worktree add --detach /tmp/rev295-main-attempt origin/main
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev295-main-attempt \
            --claim-id chatgpt-session-j-rev295-signed-ground-proof-dag-20260822T1252JST-f3c4cedb \
            --phase attempt_solution \
            --scope crx3/algorithmic-consumers/signed-johnson-ground-exact-terminal-proof-dag \
            --target-revision 295 \
            --path .github/workflows/rev295-signed-ground-proof-dag-smoke.yml \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev295-signed-ground-proof-dag-20260822T1252JST-f3c4cedb-attempt-solution.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev295-signed-ground-proof-dag-20260822T1252JST-f3c4cedb-publish.json \
            --path automation_runs/2026-08-19_0851_JST/REV295_SIGNED_GROUND_PROOF_DAG.md \
            --path automation_runs/2026-08-19_0851_JST/signed_johnson_ground_proof_dag_consumer_v1.py \
            --path automation_runs/2026-08-19_0851_JST/test_signed_johnson_ground_proof_dag_consumer_rev295.py \
            --output /tmp/rev295-attempt-solution.json
          cat /tmp/rev295-attempt-solution.json
      - name: Preserve generated attempt evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev295-attempt-solution-evidence
          path: /tmp/rev295-attempt-solution.json
          if-no-files-found: error
          retention-days: 1
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Compile rev295 consumer and tests
        run: |
          cd automation_runs/2026-08-19_0851_JST
          python -m py_compile signed_johnson_ground_proof_dag_consumer_v1.py test_signed_johnson_ground_proof_dag_consumer_rev295.py
      - name: Run rev176, rev220/rev289, and focused rev295 tests
        run: |
          cd automation_runs/2026-08-19_0851_JST
          python -m pytest -q \
            test_signed_johnson_ground_relational_si_rev176.py \
            test_proof_dag_accounting_rev220.py \
            test_proof_dag_envelope_input_validation_rev289.py \
            test_signed_johnson_ground_proof_dag_consumer_rev295.py
      - name: Reject sibling branch-only dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('automation_runs/2026-08-19_0851_JST/signed_johnson_ground_proof_dag_consumer_v1.py').read_text()
          forbidden = (
              'primitive_johnson_proof_dag_consumer_v1',
              'literal_giant',
              'parent_outcome_proof_dag',
              'corrected_soj',
              'homogeneous_block_action_kernel_v1',
          )
          hits = [name for name in forbidden if name in text]
          if hits:
              raise SystemExit(f'branch-only/sibling dependency detected: {hits}')
          PY
      - name: Generate canonical publish admission snapshot
        run: |
          git fetch --no-tags origin main
          rm -rf /tmp/rev295-main-publish
          git worktree add --detach /tmp/rev295-main-publish origin/main
          python automation/problem_solving_parallel_admission.py \
            --root /tmp/rev295-main-publish \
            --claim-id chatgpt-session-j-rev295-signed-ground-proof-dag-20260822T1252JST-f3c4cedb \
            --phase publish \
            --scope crx3/algorithmic-consumers/signed-johnson-ground-exact-terminal-proof-dag \
            --target-revision 295 \
            --path .github/workflows/rev295-signed-ground-proof-dag-smoke.yml \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev295-signed-ground-proof-dag-20260822T1252JST-f3c4cedb-attempt-solution.json \
            --path agi/run-history/phase-admissions/chatgpt-session-j-rev295-signed-ground-proof-dag-20260822T1252JST-f3c4cedb-publish.json \
            --path automation_runs/2026-08-19_0851_JST/REV295_SIGNED_GROUND_PROOF_DAG.md \
            --path automation_runs/2026-08-19_0851_JST/signed_johnson_ground_proof_dag_consumer_v1.py \
            --path automation_runs/2026-08-19_0851_JST/test_signed_johnson_ground_proof_dag_consumer_rev295.py \
            --output /tmp/rev295-publish.json
          cat /tmp/rev295-publish.json
      - name: Preserve generated publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: rev295-publish-evidence
          path: /tmp/rev295-publish.json
          if-no-files-found: error
          retention-days: 1
