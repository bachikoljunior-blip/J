name: rev1400 SOJ recursive production execution proof-DAG smoke

on:
  push:
    branches:
      - agi-gi-rev1400-soj-recursive-production-execution-proof-dag-session-20260822-1616
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rev1400-soj-recursive-production-execution-proof-dag-smoke.yml'
      - 'automation_runs/2026-08-22_1616_JST/REV1400_SOJ_RECURSIVE_PRODUCTION_EXECUTION_PROOF_DAG.md'
      - 'automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py'
      - 'automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f-attempt-solution.json'
      - 'agi/run-history/phase-admissions/chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f-publish.json'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: automation_runs/2026-08-19_0851_JST:automation_runs/2026-08-22_1616_JST
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inherited proof-DAG test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile rev1400 module and tests
        run: |
          python -m py_compile \
            automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py \
            automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py
      - name: Run rev1400 focused regressions
        run: python automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py
      - name: Run inherited proof-DAG regressions
        run: python automation_runs/2026-08-19_0851_JST/test_proof_dag_accounting_rev220.py
      - name: Reject sibling branch-only implementation imports
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'soj_recursive_production_lineage_closure_v1|corrected_soj_johnson_recursive_result_lift_v1' \
            automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py
      - name: Canonical attempt_solution admission preview
        shell: bash
        run: |
          set -euo pipefail
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f \
            --phase attempt_solution \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-production-execution-proof-dag \
            --target-revision 1400 \
            --path .github/workflows/rev1400-soj-recursive-production-execution-proof-dag-smoke.yml \
            --path automation_runs/2026-08-22_1616_JST/REV1400_SOJ_RECURSIVE_PRODUCTION_EXECUTION_PROOF_DAG.md \
            --path automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py \
            --path automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py \
            --output /tmp/rev1400-attempt.json
          test -s /tmp/rev1400-attempt.json
          cat /tmp/rev1400-attempt.json
      - name: Canonical publish admission preview
        shell: bash
        run: |
          set -euo pipefail
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f \
            --phase publish \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-production-execution-proof-dag \
            --target-revision 1400 \
            --path .github/workflows/rev1400-soj-recursive-production-execution-proof-dag-smoke.yml \
            --path automation_runs/2026-08-22_1616_JST/REV1400_SOJ_RECURSIVE_PRODUCTION_EXECUTION_PROOF_DAG.md \
            --path automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py \
            --path automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py \
            --output /tmp/rev1400-publish.json
          test -s /tmp/rev1400-publish.json
          cat /tmp/rev1400-publish.json
      - name: Enforce reserved rev1400 diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only "$base" HEAD > /tmp/rev1400-changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/rev1400-soj-recursive-production-execution-proof-dag-smoke.yml',
              'automation_runs/2026-08-22_1616_JST/REV1400_SOJ_RECURSIVE_PRODUCTION_EXECUTION_PROOF_DAG.md',
              'automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py',
              'automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f-attempt-solution.json',
              'agi/run-history/phase-admissions/chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f-publish.json',
          }
          expected = {
              '.github/workflows/rev1400-soj-recursive-production-execution-proof-dag-smoke.yml',
              'automation_runs/2026-08-22_1616_JST/REV1400_SOJ_RECURSIVE_PRODUCTION_EXECUTION_PROOF_DAG.md',
              'automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py',
              'automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py',
          }
          changed = {line.strip() for line in Path('/tmp/rev1400-changed.txt').read_text().splitlines() if line.strip()}
          extra = sorted(changed - allowed)
          missing = sorted(expected - changed)
          assert not extra, f'unreserved rev1400 paths changed: {extra}'
          assert not missing, f'missing expected rev1400 paths: {missing}'
          print('reserved-path diff ok:', sorted(changed))
          PY
      - name: Materialize canonical attempt_solution admission after green smoke
        if: github.event_name == 'push'
        shell: bash
        env:
          EVIDENCE: agi/run-history/phase-admissions/chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f-attempt-solution.json
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE" ]]; then
            echo 'canonical attempt_solution evidence already present; no branch mutation'
          else
            python automation/problem_solving_parallel_admission.py \
              --claim-id chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f \
              --phase attempt_solution \
              --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-production-execution-proof-dag \
              --target-revision 1400 \
              --path .github/workflows/rev1400-soj-recursive-production-execution-proof-dag-smoke.yml \
              --path automation_runs/2026-08-22_1616_JST/REV1400_SOJ_RECURSIVE_PRODUCTION_EXECUTION_PROOF_DAG.md \
              --path automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py \
              --path automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py \
              --output "$EVIDENCE"
            test -s "$EVIDENCE"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$EVIDENCE"
            git commit -m 'coordination: add rev1400 attempt-solution admission evidence'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Materialize canonical publish admission after green smoke
        if: github.event_name == 'push'
        shell: bash
        env:
          EVIDENCE: agi/run-history/phase-admissions/chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f-publish.json
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE" ]]; then
            echo 'canonical publish evidence already present; no branch mutation'
            exit 0
          fi
          python automation/problem_solving_parallel_admission.py \
            --claim-id chatgpt-session-j-rev1400-soj-recursive-production-execution-proof-dag-20260822T161600JST-a8a5b96f \
            --phase publish \
            --scope w1r-h6/corrected-split-or-johnson/larger-ground-recursive-production-execution-proof-dag \
            --target-revision 1400 \
            --path .github/workflows/rev1400-soj-recursive-production-execution-proof-dag-smoke.yml \
            --path automation_runs/2026-08-22_1616_JST/REV1400_SOJ_RECURSIVE_PRODUCTION_EXECUTION_PROOF_DAG.md \
            --path automation_runs/2026-08-22_1616_JST/soj_recursive_production_execution_proof_dag_v1.py \
            --path automation_runs/2026-08-22_1616_JST/test_soj_recursive_production_execution_proof_dag_rev1400.py \
            --output "$EVIDENCE"
          test -s "$EVIDENCE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVIDENCE"
          git commit -m 'coordination: add rev1400 publish admission evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
