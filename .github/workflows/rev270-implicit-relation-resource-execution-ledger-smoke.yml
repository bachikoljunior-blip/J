name: rev270 implicit relation resource execution ledger smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation_runs/2026-08-19_0851_JST/implicit_relation_resource_execution_ledger_v1.py'
      - 'automation_runs/2026-08-19_0851_JST/test_implicit_relation_resource_execution_ledger_rev270.py'
      - 'automation_runs/2026-08-19_0851_JST/REV270_IMPLICIT_RELATION_RESOURCE_EXECUTION_LEDGER.md'
      - '.github/workflows/rev270-implicit-relation-resource-execution-ledger-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: automation_runs/2026-08-19_0851_JST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile rev270 resource ledger
        run: >-
          python -m py_compile
          implicit_relation_resource_execution_ledger_v1.py
          test_implicit_relation_resource_execution_ledger_rev270.py
      - name: Run rev270 and inherited rev250 ticket regressions
        run: >-
          python -m unittest -v
          test_implicit_relation_resource_execution_ledger_rev270.py
          test_phase_start_ticket_ledger_rev250.py
